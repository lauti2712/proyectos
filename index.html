<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — Lauti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0e;--bg2:#141416;--bg3:#1c1c1f;--bg4:#242428;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --accent:#e8c97e;--accent2:#d4a74a;
  --text:#f0ede8;--text2:#9d9a94;--text3:#5c5a56;
  --danger:#e07070;--t:.18s ease;
}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;min-height:100vh;}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.lcard{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:52px 44px;width:100%;max-width:400px;}
.lcard h1{font-family:'DM Serif Display',serif;font-size:2.2rem;margin-bottom:6px;}
.lcard h1 em{color:var(--accent);font-style:italic;}
.lcard p{color:var(--text2);font-size:.88rem;margin-bottom:28px;}
.lerr{color:var(--danger);font-size:.82rem;margin-bottom:10px;display:none;}

/* HEADER */
header{background:rgba(20,20,22,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.ht{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);}
.logo{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent);font-style:italic;}
.hnav{display:flex;gap:4px;padding:0 20px;overflow-x:auto;min-height:44px;align-items:center;scrollbar-width:none;}
.hnav::-webkit-scrollbar{display:none;}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:6px 15px;border-radius:20px;font-size:.84rem;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border:1px solid transparent;background:transparent;font-family:'Instrument Sans',sans-serif;transition:all var(--t);}
.ptab:hover{color:var(--text);background:var(--bg3);}
.ptab.on{color:var(--accent);background:rgba(232,201,126,.1);border-color:rgba(232,201,126,.2);}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.5;}
.ptab.on .pdot{opacity:1;}

/* MAIN */
main{padding:28px 24px;max-width:1400px;margin:0 auto;}

/* HOME */
.vtit{font-family:'DM Serif Display',serif;font-size:1.9rem;margin-bottom:6px;}
.vsub{color:var(--text2);font-size:.88rem;margin-bottom:28px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.pcard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;cursor:pointer;transition:all var(--t);}
.pcard:hover{border-color:var(--border2);transform:translateY(-2px);}
.pcard-icon{font-size:1.7rem;margin-bottom:10px;}
.pcard-name{font-weight:600;font-size:.98rem;margin-bottom:5px;}
.pcard-desc{color:var(--text2);font-size:.8rem;line-height:1.5;margin-bottom:12px;}
.pcard-meta{font-size:.76rem;color:var(--accent);}
.pnew{background:transparent;border:1px dashed var(--border);border-radius:14px;padding:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;color:var(--text3);font-size:.86rem;font-family:'Instrument Sans',sans-serif;transition:all var(--t);}
.pnew:hover{border-color:var(--accent);color:var(--accent);}

/* PROJECT VIEW */
.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.phead-l{display:flex;align-items:center;gap:14px;}
.phead-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.phead h2{font-family:'DM Serif Display',serif;font-size:1.7rem;letter-spacing:-.02em;}
.phead p{color:var(--text2);font-size:.86rem;margin-top:2px;}

/* TOOLBAR */
.vtb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.vsw{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
.vsb{padding:5px 11px;border-radius:5px;font-size:.79rem;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:all var(--t);font-family:'Instrument Sans',sans-serif;}
.vsb.on{background:var(--bg4);color:var(--text);}
.tgb{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:.77rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text3);transition:all var(--t);font-family:'Instrument Sans',sans-serif;}
.tgb.on{background:rgba(232,201,126,.1);border-color:rgba(232,201,126,.25);color:var(--accent);}
.tgb .td{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;}
.tgb.on .td{opacity:1;}
.sw{position:relative;}
.sw input{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 12px 6px 30px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:.82rem;outline:none;transition:all var(--t);width:180px;}
.sw input:focus{border-color:var(--accent);width:230px;}
.sw input::placeholder{color:var(--text3);}
.sw-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.75rem;pointer-events:none;}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.chip{padding:3px 10px;border-radius:20px;font-size:.76rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all var(--t);}
.chip.on{background:rgba(232,201,126,.12);border-color:rgba(232,201,126,.3);color:var(--accent);}
.chip.catc{border-left-width:3px;}

/* KANBAN */
#kb{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;}
#kb::-webkit-scrollbar{height:5px;}
#kb::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
.kcol{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:265px;max-width:300px;flex-shrink:0;transition:border-color var(--t);}
.kcol.dov{border-color:var(--accent);}
.kch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.kch-l{display:flex;align-items:center;gap:7px;}
.kcdot{width:8px;height:8px;border-radius:50%;}
.kct{font-weight:600;font-size:.86rem;}
.kcc{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:1px 7px;font-size:.73rem;color:var(--text2);font-family:'DM Mono',monospace;}
.kca{display:flex;gap:3px;}
.kcab{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.74rem;transition:all var(--t);}
.kcab:hover{background:var(--bg3);color:var(--text2);}
.citems{display:flex;flex-direction:column;gap:7px;min-height:32px;}
.ki{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 12px;cursor:grab;transition:all var(--t);position:relative;}
.ki:hover{border-color:var(--border2);box-shadow:0 4px 14px rgba(0,0,0,.3);}
.ki.drg{opacity:.35;}
.ki-t{font-size:.86rem;font-weight:500;line-height:1.4;margin-bottom:3px;}
.ki-dp{font-size:.76rem;color:var(--text2);line-height:1.4;margin-bottom:5px;}
.ki-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ki-date{font-size:.72rem;color:var(--text3);font-family:'DM Mono',monospace;}
.ki-date.ov{color:var(--danger);}
.ki-date.sn{color:var(--accent);}
.ki-tag{font-size:.7rem;padding:2px 7px;border-radius:20px;font-weight:500;}
.ki-cb{font-size:.72rem;color:var(--text3);margin-top:4px;}
.ki-act{position:absolute;top:7px;right:7px;display:none;gap:3px;}
.ki:hover .ki-act{display:flex;}
.ki-ab{background:var(--bg4);border:1px solid var(--border);border-radius:4px;color:var(--text3);cursor:pointer;padding:3px 6px;font-size:.7rem;transition:all var(--t);}
.ki-ab:hover{color:var(--text);}
.kadd{width:100%;background:transparent;border:1px dashed var(--border);border-radius:8px;padding:7px;color:var(--text3);cursor:pointer;font-size:.8rem;transition:all var(--t);margin-top:4px;font-family:'Instrument Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;}
.kadd:hover{border-color:var(--accent);color:var(--accent);}
.kaddcol{background:transparent;border:1px dashed var(--border);border-radius:12px;padding:14px 18px;min-width:180px;cursor:pointer;transition:all var(--t);display:flex;align-items:center;gap:7px;color:var(--text3);font-size:.82rem;align-self:flex-start;flex-shrink:0;font-family:'Instrument Sans',sans-serif;}
.kaddcol:hover{border-color:var(--accent);color:var(--accent);}

/* LIST */
#lb{display:flex;flex-direction:column;gap:5px;}
.lsec-t{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin:16px 0 7px;display:flex;align-items:center;gap:7px;}
.lsec-t::after{content:'';flex:1;height:1px;background:var(--border);}
.lrow{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all var(--t);}
.lrow:hover{border-color:var(--border2);background:var(--bg3);}
.lrow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.lrow-t{flex:1;font-size:.86rem;font-weight:500;}
.lrow-m{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* DETAIL MODAL */
.dmb{display:flex;gap:20px;}
.dm{flex:1;min-width:0;}
.dsb{width:200px;flex-shrink:0;border-left:1px solid var(--border);padding-left:18px;}
.d-tit-in{font-family:'DM Serif Display',serif;font-size:1.5rem;background:none;border:none;border-bottom:1px solid transparent;outline:none;color:var(--text);width:100%;margin-bottom:10px;transition:border-color var(--t);}
.d-tit-in:focus{border-bottom-color:var(--accent);}
.d-desc-in{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:.86rem;width:100%;outline:none;resize:vertical;min-height:70px;line-height:1.5;transition:border-color var(--t);}
.d-desc-in:focus{border-color:var(--accent);}
.dsl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin:16px 0 6px;}
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:210px;overflow-y:auto;}
.cm{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
.cm-t{font-size:.84rem;line-height:1.5;margin-bottom:5px;white-space:pre-wrap;}
.cm-m{font-size:.71rem;color:var(--text3);font-family:'DM Mono',monospace;display:flex;justify-content:space-between;}
.cm-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.71rem;}
.cm-del:hover{color:var(--danger);}
.ciw{display:flex;gap:6px;align-items:flex-end;}
.ci{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:.84rem;outline:none;resize:none;min-height:50px;line-height:1.4;transition:border-color var(--t);}
.ci:focus{border-color:var(--accent);}
.cbadge{padding:6px 10px;border-radius:20px;font-size:.78rem;font-weight:500;cursor:pointer;border:2px solid transparent;transition:all var(--t);background:transparent;display:block;width:100%;text-align:left;margin-bottom:4px;font-family:'Instrument Sans',sans-serif;}
.sfl{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:4px;}
.sff{margin-bottom:12px;}

/* MODALS */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.md{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:26px;width:100%;max-width:490px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:su .2s ease;}
.md.wide{max-width:740px;}
@keyframes su{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mt{font-family:'DM Serif Display',serif;font-size:1.3rem;}
.mx{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;padding:5px 9px;font-size:.86rem;transition:all var(--t);}
.mx:hover{background:var(--bg4);color:var(--text);}
.fg{margin-bottom:13px;}
.fl{display:block;font-size:.77rem;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Instrument Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color var(--t);}
.fi:focus{border-color:var(--accent);}
.fi::placeholder{color:var(--text3);}
textarea.fi{resize:vertical;min-height:66px;line-height:1.5;}
.ep{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
.eo{font-size:1.3rem;padding:4px 6px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all var(--t);background:var(--bg3);}
.eo:hover,.eo.sel{border-color:var(--accent);}
.cp{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.co{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all var(--t);}
.co:hover,.co.sel{border-color:white;transform:scale(1.15);}
.mf{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
.mfl{flex:1;}

/* BUTTONS */
.btn{width:100%;background:var(--accent);color:#0c0c0e;border:none;border-radius:8px;padding:13px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.92rem;cursor:pointer;transition:all var(--t);}
.btn:hover{background:var(--accent2);}
.bg{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:.82rem;cursor:pointer;transition:all var(--t);}
.bg:hover{background:var(--bg3);color:var(--text);}
.bi{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text2);cursor:pointer;font-size:.8rem;transition:all var(--t);display:inline-flex;align-items:center;gap:5px;font-family:'Instrument Sans',sans-serif;}
.bi:hover{background:var(--bg4);color:var(--text);}
.bd{background:rgba(224,112,112,.1);color:var(--danger);border:1px solid rgba(224,112,112,.2);border-radius:8px;padding:6px 12px;font-family:'Instrument Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all var(--t);}
.bd:hover{background:rgba(224,112,112,.2);}
.ba{background:var(--accent);color:#0c0c0e;border:none;border-radius:8px;padding:7px 16px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;transition:all var(--t);}
.ba:hover{background:var(--accent2);}
.bs{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text2);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:.77rem;transition:all var(--t);}
.bs:hover{background:var(--bg4);color:var(--text);}

/* MISC */
.ld{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3);gap:10px;font-size:.85rem;}
.sp{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.es{text-align:center;padding:28px 14px;color:var(--text3);font-size:.83rem;line-height:1.7;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 15px;font-size:.82rem;color:var(--text);z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fiu .2s ease;}
@keyframes fiu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
@media(max-width:640px){.lcard{padding:36px 20px;}main{padding:16px 12px;}.dmb{flex-direction:column;}.dsb{width:100%;border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:14px;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <h1>Mis <em>Proyectos</em></h1>
    <p>Ingresá tu clave para acceder</p>
    <div style="margin-bottom:12px">
      <input type="password" id="lpin" class="fi" placeholder="••••••••••" autocomplete="off" style="letter-spacing:.1em">
    </div>
    <div class="lerr" id="lerr">Clave incorrecta</div>
    <button class="btn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- APP (hidden until login) -->
<div id="app" style="display:none">
  <header>
    <div class="ht">
      <div class="logo">Proyectos ✦</div>
      <button class="bi" onclick="logout()">Salir</button>
    </div>
    <nav class="hnav" id="hnav">
      <button class="ptab on" id="tab-home" onclick="showHome()"><span class="pdot"></span> Inicio</button>
    </nav>
  </header>

  <main>
    <!-- HOME VIEW -->
    <div id="vh">
      <h1 class="vtit">Tus proyectos</h1>
      <p class="vsub">Abrí un proyecto o creá uno nuevo.</p>
      <div class="pgrid" id="pgrid">
        <div class="ld"><div class="sp"></div> Cargando...</div>
      </div>
    </div>

    <!-- PROJECT VIEW -->
    <div id="vp" style="display:none">
      <div class="phead">
        <div class="phead-l">
          <span style="font-size:2rem" id="pej">📋</span>
          <div>
            <h2 id="ptit"></h2>
            <p id="pdesc"></p>
          </div>
        </div>
        <div class="phead-r">
          <button class="bi" onclick="openEditProject()">✏️ Editar</button>
          <button class="bi" onclick="openAddCat()">＋ Categoría</button>
          <button class="ba" onclick="openAddItem(null)">＋ Nuevo tema</button>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="vtb">
        <div class="vsw">
          <button class="vsb on" id="vs-k" onclick="setView('k')">⠿ Kanban</button>
          <button class="vsb" id="vs-l" onclick="setView('l')">☰ Lista</button>
        </div>
        <button class="tgb on" id="tg-search" onclick="toggleF('search')"><span class="td"></span>Búsqueda</button>
        <button class="tgb on" id="tg-filters" onclick="toggleF('filters')"><span class="td"></span>Filtros</button>
        <button class="tgb on" id="tg-desc" onclick="toggleF('desc')"><span class="td"></span>Descripción</button>
        <button class="tgb on" id="tg-comments" onclick="toggleF('comments')"><span class="td"></span>Comentarios</button>
        <button class="tgb on" id="tg-dates" onclick="toggleF('dates')"><span class="td"></span>Fechas</button>
        <div style="flex:1"></div>
        <div class="sw" id="swrap">
          <span class="sw-icon">🔍</span>
          <input type="text" id="sinp" placeholder="Buscar..." oninput="applyF()">
        </div>
      </div>

      <!-- FILTER CHIPS -->
      <div id="fca"></div>

      <!-- KANBAN / LIST -->
      <div id="kb"></div>
      <div id="lb" style="display:none"></div>
    </div>
  </main>
</div>

<!-- MODAL: Proyecto -->
<div class="mo" id="m-proj">
  <div class="md">
    <div class="mh"><span class="mt" id="mp-t">Nuevo proyecto</span><button class="mx" onclick="closeM('m-proj')">✕</button></div>
    <div class="fg"><label class="fl">Nombre</label><input class="fi" id="mp-name" placeholder="ej. Vesuvio, Franquicia..."></div>
    <div class="fg"><label class="fl">Descripción</label><textarea class="fi" id="mp-desc" placeholder="Opcional..."></textarea></div>
    <div class="fg"><label class="fl">Ícono</label><div class="ep" id="ep"></div></div>
    <div class="mf"><button class="bg" onclick="closeM('m-proj')">Cancelar</button><button class="ba" onclick="saveProj()">Guardar</button></div>
  </div>
</div>

<!-- MODAL: Categoría -->
<div class="mo" id="m-cat">
  <div class="md">
    <div class="mh"><span class="mt" id="mc-t">Nueva categoría</span><button class="mx" onclick="closeM('m-cat')">✕</button></div>
    <div class="fg"><label class="fl">Nombre</label><input class="fi" id="mc-name" placeholder="ej. Pendientes, En curso..."></div>
    <div class="fg"><label class="fl">Color</label><div class="cp" id="cp-cat"></div></div>

<div class="mo" id="m-det">

          <div class="dsl" style="margin-top:16px">Comentarios</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore,collection,doc,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp,query,orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey:"AIzaSyCWZniGvRktycwnOmjQIX-wEvjrPhY-EOM",
  authDomain:"proyectoslauti.firebaseapp.com",
  projectId:"proyectoslauti",
  storageBucket:"proyectoslauti.firebasestorage.app",
  messagingSenderId:"593302100716",
  appId:"1:593302100716:web:4d9c0d3a8f34679528a3c9"
}));

const CODE="lautarom123";
const COLORS=["#e8c97e","#e07070","#6ec97a","#7ab8e0","#c97edd","#e0a87a","#7ec9c9","#b07e7e","#8ec97e","#a8a8e0"];
const EMOJIS=["🚀","📋","💼","🏠","🎯","📊","💡","🔧","🍕","📦","🗂️","⭐","🌟","🔥","💰","📅","🎨","📝","🏗️","🎪"];

let cur=null,ePid=null,eCid=null,eIid=null,detId=null;
let sEmoji=EMOJIS[0],sCatC=COLORS[0],sTagC=COLORS[0],sDetC=COLORS[0];
let curV="k",cats=[],items=[],af={catId:null,tag:null};
const feat={search:true,filters:true,desc:true,comments:true,dates:true};

function g(id){return document.getElementById(id);}
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):"";} 

// ── Login ──
window.doLogin=()=>{
  if(g("lpin").value===CODE){
    g("login").style.display="none";
    g("app").style.display="block";
    loadProjects();
  } else {
    g("lerr").style.display="block";
    g("lpin").value="";
  }
};
g("lpin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
window.logout=()=>{g("app").style.display="none";g("login").style.display="flex";g("lpin").value="";cur=null;};

// ── Feature toggles ──
window.toggleF=k=>{
  feat[k]=!feat[k];
  g("tg-"+k).classList.toggle("on",feat[k]);
  g("swrap").style.display=feat.search?"":"none";
  g("fca").style.display=feat.filters?"":"none";
  g("d-cm-sec").style.display=feat.comments?"":"none";
  renderBoard();
};
window.setView=v=>{
  curV=v;
  g("vs-k").classList.toggle("on",v==="k");
  g("vs-l").classList.toggle("on",v==="l");
  g("kb").style.display=v==="k"?"":"none";
  g("lb").style.display=v==="l"?"":"none";
  renderBoard();
};

// ── Projects ──
async function loadProjects(){
  g("pgrid").innerHTML='<div class="ld"><div class="sp"></div> Cargando...</div>';
  try{
    let snap;
    try{ snap=await getDocs(query(collection(db,"projects"),orderBy("createdAt","asc"))); }
    catch(e){ snap=await getDocs(collection(db,"projects")); }
    renderGrid(snap);
    buildNav(snap);
  } catch(e){
    g("pgrid").innerHTML='<div class="es">Error: '+e.message+'</div>';
  }
}
function renderGrid(snap){
  const grid=g("pgrid"); grid.innerHTML="";
  snap.forEach(d=>{
    const p=d.data();
    const c=mk("div","pcard");
    c.innerHTML='<div class="pcard-icon">'+(p.emoji||"📋")+'</div><div class="pcard-name">'+esc(p.name)+'</div><div class="pcard-desc">'+esc(p.desc||"Sin descripción")+'</div><div class="pcard-meta">→ Abrir</div>';
    c.onclick=()=>openProject(d.id,p);
    grid.appendChild(c);
  });
  const a=mk("div","pnew");
  a.innerHTML='<span style="font-size:1.5rem">＋</span><span>Nuevo proyecto</span>';
  a.onclick=()=>openNewProj();
  grid.appendChild(a);
}
function buildNav(snap){
  const nav=g("hnav");
  nav.querySelectorAll(".ptab:not(#tab-home)").forEach(t=>t.remove());
  snap.forEach(d=>{
    const p=d.data(),t=mk("button","ptab");
    t.id="tab-"+d.id;
    t.innerHTML='<span class="pdot"></span> '+(p.emoji||"")+" "+esc(p.name);
    t.onclick=()=>openProject(d.id,p);
    nav.appendChild(t);
  });
}
window.showHome=()=>{
  g("vh").style.display="block";
  g("vp").style.display="none";
  document.querySelectorAll(".ptab").forEach(t=>t.classList.remove("on"));
  g("tab-home").classList.add("on");
  cur=null;
  loadProjects();
};

// ── New/Edit Project ──
window.openNewProj=()=>{ ePid=null; g("mp-t").textContent="Nuevo proyecto"; g("mp-name").value=""; g("mp-desc").value=""; sEmoji=EMOJIS[0]; buildEP(); openM("m-proj"); };
window.openEditProject=()=>{ if(!cur)return; ePid=cur.id; g("mp-t").textContent="Editar proyecto"; g("mp-name").value=cur.data.name; g("mp-desc").value=cur.data.desc||""; sEmoji=cur.data.emoji||EMOJIS[0]; buildEP(); openM("m-proj"); };
window.saveProj=async()=>{
  const name=g("mp-name").value.trim(); if(!name)return toast("Ingresá un nombre");
  const desc=g("mp-desc").value.trim();
  try{
    if(ePid){
      await updateDoc(doc(db,"projects",ePid),{name,desc,emoji:sEmoji});
      if(cur){cur.data.name=name;cur.data.desc=desc;cur.data.emoji=sEmoji;}
      g("ptit").textContent=name; g("pdesc").textContent=desc; g("pej").textContent=sEmoji;
      toast("Proyecto actualizado ✓");
    } else {
      const r=await addDoc(collection(db,"projects"),{name,desc,emoji:sEmoji,createdAt:serverTimestamp()});
      for(const[n,c]of[["Pendientes","#e07070"],["A coordinar","#e8c97e"],["Hecho","#6ec97a"]])
        await addDoc(collection(db,"projects",r.id,"categories"),{name:n,color:c,createdAt:serverTimestamp()});
      toast("Proyecto creado ✓");
    }
    closeM("m-proj"); loadProjects();
  } catch(e){ toast("Error: "+e.message); }
};

// ── Open Project ──
window.openProject=async(id,data)=>{
  cur={id,data};
  g("vh").style.display="none";
  g("vp").style.display="block";
  g("ptit").textContent=data.name;
  g("pdesc").textContent=data.desc||"";
  g("pej").textContent=data.emoji||"📋";
  document.querySelectorAll(".ptab").forEach(t=>t.classList.remove("on"));
  const tab=g("tab-"+id);
  if(tab){ tab.classList.add("on"); tab.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}); }
  af={catId:null,tag:null};
  g("sinp").value="";
  g("kb").innerHTML='<div class="ld"><div class="sp"></div> Cargando...</div>';
  g("lb").innerHTML="";
  try{
    await fetchData(id);
    buildChips();
    renderBoard();
  } catch(e){
    g("kb").innerHTML='<div class="es">Error: '+e.message+'</div>';
    toast("Error: "+e.message);
  }
};

async function fetchData(pid){
  let cs,is;
  try{
    [cs,is]=await Promise.all([
      getDocs(query(collection(db,"projects",pid,"categories"),orderBy("createdAt","asc"))),
      getDocs(query(collection(db,"projects",pid,"items"),orderBy("createdAt","asc")))
    ]);
  } catch(_){
    [cs,is]=await Promise.all([
      getDocs(collection(db,"projects",pid,"categories")),
      getDocs(collection(db,"projects",pid,"items"))
    ]);
  }
  cats=[];
  items=[];
  cs.forEach(d=>cats.push({id:d.id,...d.data()}));
  is.forEach(d=>items.push({id:d.id,...d.data()}));
}

function filtered(){
  const q=feat.search?g("sinp").value.toLowerCase().trim():"";
  return items.filter(i=>{
    if(af.catId&&i.catId!==af.catId)return false;
    if(af.tag&&i.tag!==af.tag)return false;
    if(q){const h=(i.title+" "+(i.desc||"")+" "+(i.tag||"")).toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
}
window.applyF=()=>renderBoard();

function buildChips(){
  const a=g("fca"); a.innerHTML=""; a.style.display=feat.filters?"":"none";
  const w=mk("div","chips"); a.appendChild(w);
  cats.forEach(cat=>{
    const c=mk("button","chip catc");
    c.style.borderLeftColor=cat.color; c.textContent=cat.name;
    if(af.catId===cat.id)c.classList.add("on");
    c.onclick=()=>{af.catId=af.catId===cat.id?null:cat.id;buildChips();renderBoard();};
    w.appendChild(c);
  });
  [...new Set(items.map(i=>i.tag).filter(Boolean))].forEach(tag=>{
    const c=mk("button","chip"); c.textContent="🏷 "+tag;
    if(af.tag===tag)c.classList.add("on");
    c.onclick=()=>{af.tag=af.tag===tag?null:tag;buildChips();renderBoard();};
    w.appendChild(c);
  });
  if(af.catId||af.tag){
    const c=mk("button","chip on"); c.textContent="✕ Limpiar";
    c.onclick=()=>{af={catId:null,tag:null};buildChips();renderBoard();};
    w.appendChild(c);
  }
}

function renderBoard(){ curV==="k"?renderKanban():renderList(); }

// ── Kanban ──
function renderKanban(){
  const b=g("kb"); b.innerHTML="";
  if(!cats.length){
    b.innerHTML='<div class="es">No hay categorías aún.<br><br><button class="ba" onclick="openAddCat()">＋ Crear primera categoría</button></div>';
    return;
  }
  const flt=filtered();
  cats.forEach(cat=>{
    const itms=flt.filter(i=>i.catId===cat.id);
    const col=mk("div","kcol"); col.dataset.catId=cat.id;
    col.innerHTML=
      '<div class="kch"><div class="kch-l"><div class="kcdot" style="background:'+cat.color+'"></div><span class="kct">'+esc(cat.name)+'</span><span class="kcc">'+itms.length+'</span></div>'+
      '<div class="kca"><button class="kcab" onclick="openEditCat(\''+cat.id+'\',\''+esc(cat.name)+'\',\''+cat.color+'\')">✏️</button>'+
      '<button class="kcab" onclick="delCat(\''+cat.id+'\')">🗑</button></div></div>'+
      '<div class="citems" id="ci-'+cat.id+'"></div>'+
      '<button class="kadd" onclick="openAddItem(\''+cat.id+'\')">＋ Agregar tema</button>';
    b.appendChild(col);
    setupDrop(col,cat.id);
    const cont=col.querySelector("#ci-"+cat.id);
    if(!itms.length){
      cont.innerHTML='<div style="padding:10px 0;text-align:center;color:var(--text3);font-size:.76rem">Sin temas</div>';
    } else {
      itms.forEach(i=>cont.appendChild(mkCard(i,cat)));
    }
  });
  const a=mk("button","kaddcol");
  a.innerHTML="<span>＋</span><span>Nueva categoría</span>";
  a.onclick=()=>openAddCat();
  b.appendChild(a);
}

function mkCard(item,cat){
  const e=mk("div","ki"); e.draggable=true; e.dataset.itemId=item.id;
  const dc=getDC(item.date);
  e.innerHTML=
    '<div class="ki-t">'+esc(item.title)+'</div>'+
    (feat.desc&&item.desc?'<div class="ki-dp">'+esc(item.desc.substring(0,80))+(item.desc.length>80?"…":"")+'</div>':"")+
    '<div class="ki-m">'+
    (feat.dates&&item.date?'<span class="ki-date '+dc+'">📅 '+item.date+'</span>':"")+
    (item.tag?'<span class="ki-tag" style="background:'+(item.tagColor||cat.color)+'22;color:'+(item.tagColor||cat.color)+'">'+esc(item.tag)+'</span>':"")+
    '</div>'+
    (feat.comments&&(item.comments||[]).length?'<div class="ki-cb">💬 '+item.comments.length+'</div>':"")+
    '<div class="ki-act">'+
    '<button class="ki-ab" onclick="openDet(\''+item.id+'\')">🔍</button>'+
    '<button class="ki-ab" onclick="openEditItem(\''+item.id+'\')">✏️</button>'+
    '</div>';
  e.addEventListener("dragstart",ev=>{ev.dataTransfer.setData("iid",item.id);ev.dataTransfer.setData("fcat",item.catId);setTimeout(()=>e.classList.add("drg"),0);});
  e.addEventListener("dragend",()=>e.classList.remove("drg"));
  return e;
}

function setupDrop(col,catId){
  col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dov");});
  col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("dov");});
  col.addEventListener("drop",async e=>{
    e.preventDefault(); col.classList.remove("dov");
    const iid=e.dataTransfer.getData("iid"),fcat=e.dataTransfer.getData("fcat");
    if(fcat===catId||!iid)return;
    try{
      await updateDoc(doc(db,"projects",cur.id,"items",iid),{catId});
      const it=items.find(i=>i.id===iid); if(it)it.catId=catId;
      renderBoard(); toast("Movido ✓");
    } catch(err){ toast("Error: "+err.message); }
  });
}

// ── List ──
function renderList(){
  const b=g("lb"); b.innerHTML="";
  const flt=filtered();
  if(!flt.length){ b.innerHTML='<div class="es">Sin temas que coincidan</div>'; return; }
  cats.forEach(cat=>{
    const itms=flt.filter(i=>i.catId===cat.id); if(!itms.length)return;
    const sec=mk("div");
    const tl=mk("div","lsec-t");
    tl.innerHTML='<span class="kcdot" style="background:'+cat.color+';display:inline-block"></span>'+esc(cat.name)+' <span class="kcc">'+itms.length+'</span>';
    sec.appendChild(tl);
    itms.forEach(item=>{
      const dc=getDC(item.date);
      const row=mk("div","lrow");
      row.innerHTML=
        '<div class="lrow-dot" style="background:'+cat.color+'"></div>'+
        '<div class="lrow-t">'+esc(item.title)+'</div>'+
        '<div class="lrow-m">'+
        (feat.dates&&item.date?'<span style="font-size:.71rem;font-family:\'DM Mono\',monospace;color:var(--text3)" class="'+dc+'">📅 '+item.date+'</span>':"")+
        (item.tag?'<span class="ki-tag" style="background:'+(item.tagColor||cat.color)+'22;color:'+(item.tagColor||cat.color)+'">'+esc(item.tag)+'</span>':"")+
        (feat.comments&&(item.comments||[]).length?'<span style="font-size:.71rem;color:var(--text3)">💬 '+item.comments.length+'</span>':"")+
        '</div>';
      row.onclick=()=>openDet(item.id);
      sec.appendChild(row);
    });
    b.appendChild(sec);
  });
}

// ── Categories ──
window.openAddCat=()=>{ eCid=null; g("mc-t").textContent="Nueva categoría"; g("mc-name").value=""; g("mc-del").style.display="none"; sCatC=COLORS[0]; buildCP("cp-cat","cat"); openM("m-cat"); };
window.openEditCat=(id,name,color)=>{ eCid=id; g("mc-t").textContent="Editar categoría"; g("mc-name").value=name; g("mc-del").style.display="inline-block"; sCatC=color; buildCP("cp-cat","cat"); openM("m-cat"); };
window.saveCat=async()=>{
  if(!cur)return; const name=g("mc-name").value.trim(); if(!name)return toast("Ingresá un nombre");
  try{
    if(eCid){ await updateDoc(doc(db,"projects",cur.id,"categories",eCid),{name,color:sCatC}); const c=cats.find(c=>c.id===eCid); if(c){c.name=name;c.color=sCatC;} }
    else { const r=await addDoc(collection(db,"projects",cur.id,"categories"),{name,color:sCatC,createdAt:serverTimestamp()}); cats.push({id:r.id,name,color:sCatC}); }
    closeM("m-cat"); buildChips(); renderBoard(); toast(eCid?"Categoría actualizada ✓":"Categoría creada ✓");
  } catch(e){ toast("Error: "+e.message); }
};
window.delCat=id=>{ eCid=id; deleteCat(); };
window.deleteCat=async()=>{
  if(!cur||!eCid)return; if(!confirm("¿Eliminar esta categoría y sus temas?"))return;
  try{
    await Promise.all(items.filter(i=>i.catId===eCid).map(i=>deleteDoc(doc(db,"projects",cur.id,"items",i.id))));
    await deleteDoc(doc(db,"projects",cur.id,"categories",eCid));
    items=items.filter(i=>i.catId!==eCid); cats=cats.filter(c=>c.id!==eCid);
    closeM("m-cat"); buildChips(); renderBoard(); toast("Categoría eliminada");
  } catch(e){ toast("Error: "+e.message); }
};

// ── Items ──
window.openAddItem=catId=>{
  eIid=null; g("mi-t").textContent="Nuevo tema";
  ["mi-tit","mi-desc","mi-tag"].forEach(id=>g(id).value=""); g("mi-date").value="";
  g("mi-del").style.display="none"; sTagC=COLORS[0]; popCS(catId); buildCP("cp-tag","tag"); openM("m-item");
};
window.openEditItem=itemId=>{
  const item=items.find(i=>i.id===itemId); if(!item)return;
  eIid=itemId; g("mi-t").textContent="Editar tema";
  g("mi-tit").value=item.title; g("mi-desc").value=item.desc||""; g("mi-date").value=item.date||""; g("mi-tag").value=item.tag||"";
  g("mi-del").style.display="inline-block"; sTagC=item.tagColor||COLORS[0]; popCS(item.catId); buildCP("cp-tag","tag"); openM("m-item");
};
function popCS(selId){ const s=g("mi-cat"); s.innerHTML=""; cats.forEach(cat=>{const o=document.createElement("option");o.value=cat.id;o.textContent=cat.name;if(cat.id===selId)o.selected=true;s.appendChild(o);}); }
window.saveItem=async()=>{
  if(!cur)return; const title=g("mi-tit").value.trim(); if(!title)return toast("Ingresá un título");
  const catId=g("mi-cat").value;
  const data={title,desc:g("mi-desc").value.trim(),catId,date:g("mi-date").value||null,tag:g("mi-tag").value.trim(),tagColor:sTagC};
  try{
    if(eIid){ await updateDoc(doc(db,"projects",cur.id,"items",eIid),data); Object.assign(items.find(i=>i.id===eIid)||{},data); toast("Tema actualizado ✓"); }
    else { data.createdAt=serverTimestamp(); data.comments=[]; const r=await addDoc(collection(db,"projects",cur.id,"items"),data); items.push({id:r.id,...data}); toast("Tema creado ✓"); }
    closeM("m-item"); buildChips(); renderBoard();
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteItem=async()=>{
  if(!cur||!eIid)return; if(!confirm("¿Eliminar este tema?"))return;
  try{ await deleteDoc(doc(db,"projects",cur.id,"items",eIid)); items=items.filter(i=>i.id!==eIid); closeM("m-item"); buildChips(); renderBoard(); toast("Tema eliminado"); }
  catch(e){ toast("Error: "+e.message); }
};

// ── Item Detail ──
window.openDet=itemId=>{
  const item=items.find(i=>i.id===itemId); if(!item)return;
  detId=itemId; sDetC=item.tagColor||COLORS[0];
  g("d-tit").value=item.title; g("d-desc").value=item.desc||""; g("d-date").value=item.date||""; g("d-tag").value=item.tag||"";
  g("d-cm-sec").style.display=feat.comments?"":"none";
  renderCmts(item);
  const cl=g("d-cols"); cl.innerHTML="";
  cats.forEach(cat=>{
    const b=mk("button","cbadge");
    b.style.background=item.catId===cat.id?cat.color+"22":"transparent";
    b.style.color=cat.color; b.style.borderColor=cat.color+"44";
    b.textContent=cat.name;
    b.onclick=async()=>{
      try{
        await updateDoc(doc(db,"projects",cur.id,"items",detId),{catId:cat.id});
        const it=items.find(i=>i.id===detId); if(it)it.catId=cat.id;
        renderBoard(); openDet(detId); toast("Movido a "+cat.name);
      } catch(e){ toast("Error: "+e.message); }
    };
    cl.appendChild(b);
  });
  buildCP("cp-det","det"); openM("m-det");
};
function renderCmts(item){
  const list=g("d-clist"); list.innerHTML="";
  const cmts=item.comments||[];
  if(!cmts.length){ list.innerHTML='<div style="color:var(--text3);font-size:.8rem;padding:6px 0">Sin comentarios aún.</div>'; return; }
  cmts.forEach((c,idx)=>{
    const d=mk("div","cm");
    d.innerHTML='<div class="cm-t">'+esc(c.text)+'</div><div class="cm-m"><span>'+esc(c.date||"")+'</span><button class="cm-del" onclick="delCmt('+idx+')">Eliminar</button></div>';
    list.appendChild(d);
  });
  list.scrollTop=list.scrollHeight;
}
window.addCmt=async()=>{
  if(!cur||!detId)return;
  const inp=g("d-cinp"); const text=inp.value.trim(); if(!text)return;
  const item=items.find(i=>i.id===detId); if(!item)return;
  const cmts=[...(item.comments||[])];
  cmts.push({text,date:new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})});
  try{ await updateDoc(doc(db,"projects",cur.id,"items",detId),{comments:cmts}); item.comments=cmts; renderCmts(item); inp.value=""; renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
};
window.delCmt=async idx=>{
  if(!cur||!detId)return;
  const item=items.find(i=>i.id===detId); if(!item)return;
  const cmts=[...(item.comments||[])]; cmts.splice(idx,1);
  try{ await updateDoc(doc(db,"projects",cur.id,"items",detId),{comments:cmts}); item.comments=cmts; renderCmts(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
};
window.saveDet=async()=>{
  if(!cur||!detId)return;
  const title=g("d-tit").value.trim(); if(!title)return toast("El título no puede estar vacío");
  const data={title,desc:g("d-desc").value.trim(),date:g("d-date").value||null,tag:g("d-tag").value.trim(),tagColor:sDetC};
  try{
    await updateDoc(doc(db,"projects",cur.id,"items",detId),data);
    Object.assign(items.find(i=>i.id===detId)||{},data);
    closeM("m-det"); buildChips(); renderBoard(); toast("Guardado ✓");
  } catch(e){ toast("Error: "+e.message); }
};
window.delFromDet=async()=>{
  if(!cur||!detId)return; if(!confirm("¿Eliminar este tema?"))return;
  try{ await deleteDoc(doc(db,"projects",cur.id,"items",detId)); items=items.filter(i=>i.id!==detId); closeM("m-det"); buildChips(); renderBoard(); toast("Tema eliminado"); }
  catch(e){ toast("Error: "+e.message); }
};

// ── Pickers ──
function buildEP(){ const c=g("ep"); c.innerHTML=""; EMOJIS.forEach(e=>{const s=mk("span","eo"+(e===sEmoji?" sel":""));s.textContent=e;s.onclick=()=>{sEmoji=e;c.querySelectorAll(".eo").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");};c.appendChild(s);}); }
function buildCP(cid,type){
  const c=g(cid); c.innerHTML="";
  const cur2=type==="cat"?sCatC:type==="tag"?sTagC:sDetC;
  COLORS.forEach(col=>{
    const d=mk("div","co"+(col===cur2?" sel":""));
    d.style.background=col;
    d.onclick=()=>{if(type==="cat")sCatC=col;else if(type==="tag")sTagC=col;else sDetC=col;c.querySelectorAll(".co").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");};
    c.appendChild(d);
  });
}

// ── Modals ──
window.openM=id=>g(id).classList.add("open");
window.closeM=id=>g(id).classList.remove("open");
document.querySelectorAll(".mo").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("open");}));

function toast(msg){ const t=mk("div","toast"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function fmtD(ts){ if(!ts)return""; const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"}); }
function getDC(ds){ if(!ds)return""; const d=new Date(ds+"T00:00:00"),n=new Date(); n.setHours(0,0,0,0); const df=(d-n)/86400000; return df<0?"ov":df<=3?"sn":""; }

g("d-cinp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addCmt();}});
buildEP(); buildCP("cp-cat","cat"); buildCP("cp-tag","tag");
</script>
