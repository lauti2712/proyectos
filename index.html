<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — Lauti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2efe8;--bg2:#faf8f3;--bg3:#e8e4da;--bg4:#ddd9ce;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1710;--text2:#6b6456;--text3:#a09880;
  --accent:#2c2c2c;--panel:#1c1c1f;
  --panel-text:#f0ede8;--panel-text2:#9d9a94;--panel-text3:#5c5a56;
  --panel-border:rgba(255,255,255,0.07);--panel-border2:rgba(255,255,255,0.13);
  --panel-bg2:#141416;--panel-bg3:#1c1c1f;--panel-bg4:#242428;
  --danger:#c0392b;--t:.15s ease;
  --postit-yellow:#fef08a;--postit-shadow:2px 3px 8px rgba(0,0,0,0.18);
}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;min-height:100vh;overflow:hidden;}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--panel);}
.lcard{background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:20px;padding:52px 44px;width:100%;max-width:400px;}
.lcard h1{font-family:'DM Serif Display',serif;font-size:2.2rem;margin-bottom:6px;color:var(--panel-text);}
.lcard h1 em{color:#e8c97e;font-style:italic;}
.lcard p{color:var(--panel-text2);font-size:.88rem;margin-bottom:28px;}
.lerr{color:#e07070;font-size:.82rem;margin-bottom:10px;display:none;}
.lfi{width:100%;background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:10px 13px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.88rem;outline:none;margin-bottom:11px;transition:border-color var(--t);}
.lfi:focus{border-color:#e8c97e;}
.lfi::placeholder{color:var(--panel-text3);}
.lbtn{width:100%;background:#e8c97e;color:#0c0c0e;border:none;border-radius:8px;padding:13px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.92rem;cursor:pointer;transition:all var(--t);}
.lbtn:hover{background:#d4a74a;}

/* APP */
#app{display:none;height:100vh;flex-direction:column;}

/* TOP BAR */
.topbar{background:var(--panel);border-bottom:1px solid var(--panel-border);display:flex;align-items:center;gap:12px;padding:0 18px;height:52px;flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:1.15rem;color:#e8c97e;font-style:italic;white-space:nowrap;margin-right:6px;}
.tb-sep{width:1px;height:24px;background:var(--panel-border);flex-shrink:0;}
.tb-actions{display:flex;gap:6px;align-items:center;}
.tb-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--panel-border);background:transparent;color:var(--panel-text2);transition:all var(--t);font-family:'Instrument Sans',sans-serif;}
.tb-btn:hover{background:var(--panel-bg3);color:var(--panel-text);}
.tb-btn.accent{background:#e8c97e;color:#0c0c0e;border-color:#e8c97e;}
.tb-btn.accent:hover{background:#d4a74a;}
.tb-right{margin-left:auto;display:flex;gap:6px;align-items:center;}

/* PROJECT VISIBILITY DROPDOWN */
.vis-wrap{position:relative;}
.vis-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:12px;padding:10px;min-width:220px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fiu .15s ease;}
.vis-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:background var(--t);}
.vis-item:hover{background:var(--panel-bg3);}
.vis-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--panel-text3);display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;transition:all var(--t);}
.vis-check.on{background:#e8c97e;border-color:#e8c97e;color:#0c0c0e;}
.vis-label{font-size:.82rem;color:var(--panel-text2);flex:1;}
.vis-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* BOARD */
.board-wrap{flex:1;display:flex;overflow:hidden;}
.board{flex:1;overflow-x:auto;overflow-y:hidden;padding:20px 20px 20px;display:flex;gap:16px;align-items:flex-start;}
.board::-webkit-scrollbar{height:6px;}
.board::-webkit-scrollbar-track{background:var(--bg3);border-radius:3px;}
.board::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}

/* PROJECT COLUMN */
.proj-col{display:flex;flex-direction:column;gap:0;flex-shrink:0;width:210px;}
.proj-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
.proj-col-name{font-weight:700;font-size:.9rem;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.proj-col-emoji{font-size:1.1rem;}
.proj-col-acts{display:flex;gap:3px;opacity:0;transition:opacity var(--t);}
.proj-col:hover .proj-col-acts{opacity:1;}
.pcol-btn{background:transparent;border:none;color:var(--text3);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.74rem;transition:all var(--t);}
.pcol-btn:hover{background:var(--bg3);color:var(--text);}
.proj-items{display:flex;flex-direction:column;gap:10px;}

/* POST-IT */
.postit{background:var(--postit-yellow);border-radius:3px;padding:11px 12px;box-shadow:var(--postit-shadow);cursor:pointer;transition:transform var(--t),box-shadow var(--t);position:relative;min-height:72px;}
.postit::before{content:'';position:absolute;top:0;left:0;right:0;height:22px;background:rgba(0,0,0,0.06);border-radius:3px 3px 0 0;}
.postit:hover{transform:translateY(-2px) rotate(.4deg);box-shadow:3px 5px 14px rgba(0,0,0,.22);}
.postit.active-det{box-shadow:0 0 0 2.5px #2c2c2c,var(--postit-shadow);transform:translateY(-2px);}
.postit-title{font-size:.84rem;font-weight:700;line-height:1.35;margin-bottom:5px;padding-top:4px;font-family:'Instrument Sans',sans-serif;color:#1a1710;}
.postit-desc{font-size:.72rem;color:#4a4030;line-height:1.45;margin-bottom:6px;}
.postit-subs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px;}
.sub-chip{background:rgba(0,0,0,0.1);border-radius:3px;padding:2px 6px;font-size:.67rem;color:#3a3020;line-height:1.3;display:flex;align-items:center;gap:3px;}
.sub-chip.done{text-decoration:line-through;opacity:.5;}
.sub-dot{width:7px;height:7px;border-radius:50%;border:1px solid #3a3020;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.5rem;cursor:pointer;}
.sub-dot.done{background:#3a3020;}
.postit-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.postit-date{font-size:.67rem;color:#6a5a40;font-family:'DM Mono',monospace;}
.postit-date.ov{color:#c0392b;}
.postit-date.sn{color:#8B6914;}
.postit-tag{font-size:.66rem;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,0.1);color:#3a3020;}
.postit-edit{position:absolute;top:5px;right:6px;background:rgba(0,0,0,0.12);border:none;border-radius:3px;color:#3a3020;cursor:pointer;padding:2px 5px;font-size:.65rem;opacity:0;transition:opacity var(--t);}
.postit:hover .postit-edit{opacity:1;}

/* COLORED POSTITS (for sub-postits / accents) */
.postit.color-red{background:#fca5a5;}
.postit.color-blue{background:#93c5fd;}
.postit.color-green{background:#86efac;}
.postit.color-purple{background:#d8b4fe;}
.postit.color-orange{background:#fdba74;}
.postit.color-pink{background:#f9a8d4;}
.postit.color-teal{background:#5eead4;}
.postit.color-white{background:#f8f8f4;}

/* ADD POST-IT BUTTON */
.add-postit-btn{background:transparent;border:1.5px dashed var(--bg4);border-radius:3px;padding:8px 12px;color:var(--text3);cursor:pointer;font-size:.78rem;font-family:'Instrument Sans',sans-serif;transition:all var(--t);text-align:left;width:100%;margin-top:4px;}
.add-postit-btn:hover{border-color:var(--text2);color:var(--text2);background:rgba(0,0,0,0.04);}

/* DETAIL PANEL */
#dpanel{width:0;flex-shrink:0;background:var(--panel);overflow:hidden;transition:width .2s ease;display:flex;flex-direction:column;}
#dpanel.open{width:360px;border-left:1px solid var(--panel-border);}
.dp-top{padding:16px 18px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.dp-top span{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--panel-text3);}
.dp-close{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;color:var(--panel-text2);cursor:pointer;padding:4px 9px;font-size:.79rem;transition:all var(--t);font-family:'Instrument Sans',sans-serif;}
.dp-close:hover{color:var(--panel-text);}
.dp-scroll{flex:1;overflow-y:auto;padding:18px;}
.dp-tit{font-family:'DM Serif Display',serif;font-size:1.4rem;background:none;border:none;border-bottom:1px solid transparent;outline:none;color:var(--panel-text);width:100%;margin-bottom:12px;transition:border-color var(--t);line-height:1.35;}
.dp-tit:focus{border-bottom-color:#e8c97e;}
.dp-notes{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:10px 12px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.84rem;width:100%;outline:none;resize:none;min-height:100px;line-height:1.6;transition:border-color var(--t);}
.dp-notes:focus{border-color:#e8c97e;}
.dp-notes::placeholder{color:var(--panel-text3);}
.dp-sec{font-size:.71rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--panel-text3);margin:18px 0 8px;}
.sub-list{display:flex;flex-direction:column;gap:5px;margin-bottom:9px;}
.sub-row{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:7px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px;}
.sub-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--panel-text3);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.62rem;transition:all var(--t);}
.sub-chk.done{background:#e8c97e;border-color:#e8c97e;color:#0c0c0e;}
.sub-txt{flex:1;font-size:.82rem;color:var(--panel-text);line-height:1.4;}
.sub-txt.done{text-decoration:line-through;opacity:.45;}
.sub-del{background:none;border:none;color:var(--panel-text3);cursor:pointer;font-size:.7rem;padding:0 2px;flex-shrink:0;}
.sub-del:hover{color:#e07070;}
.sub-add-row{display:flex;gap:6px;}
.sub-inp{flex:1;background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:7px;padding:7px 10px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.81rem;outline:none;transition:border-color var(--t);}
.sub-inp:focus{border-color:#e8c97e;}
.sub-inp::placeholder{color:var(--panel-text3);}
.dp-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.dp-meta-row{display:flex;align-items:center;gap:10px;}
.dp-meta-lbl{font-size:.71rem;color:var(--panel-text3);width:60px;flex-shrink:0;}
.fi-sm{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;padding:5px 9px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.8rem;outline:none;flex:1;transition:border-color var(--t);}
.fi-sm:focus{border-color:#e8c97e;}
.fi-sm::placeholder{color:var(--panel-text3);}
.cp-sm{display:flex;gap:5px;flex-wrap:wrap;flex:1;}
.co-sm{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all var(--t);}
.co-sm:hover,.co-sm.sel{border-color:var(--panel-text);transform:scale(1.2);}
.dp-save{width:100%;background:#e8c97e;color:#0c0c0e;border:none;border-radius:8px;padding:9px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.83rem;cursor:pointer;margin-top:14px;transition:all var(--t);}
.dp-save:hover{background:#d4a74a;}
.dp-del{width:100%;background:rgba(192,57,43,.1);color:#e07070;border:1px solid rgba(192,57,43,.2);border-radius:8px;padding:7px;font-family:'Instrument Sans',sans-serif;font-size:.79rem;cursor:pointer;margin-top:6px;transition:all var(--t);}
.dp-del:hover{background:rgba(192,57,43,.2);}

/* MODALS */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.md{background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:18px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:su .16s ease;}
@keyframes su{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.mt{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--panel-text);}
.mx{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;color:var(--panel-text2);cursor:pointer;padding:4px 8px;font-size:.82rem;}
.fg{margin-bottom:12px;}
.fl{display:block;font-size:.74rem;font-weight:600;color:var(--panel-text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;}
.fi{width:100%;background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:8px 12px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.86rem;outline:none;transition:border-color var(--t);}
.fi:focus{border-color:#e8c97e;}
.fi::placeholder{color:var(--panel-text3);}
textarea.fi{resize:vertical;min-height:60px;line-height:1.5;}
.ep{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.eo{font-size:1.2rem;padding:4px 5px;border-radius:5px;cursor:pointer;border:2px solid transparent;background:var(--panel-bg3);}
.eo:hover,.eo.sel{border-color:#e8c97e;}
.mf{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:16px;padding-top:12px;border-top:1px solid var(--panel-border);}
.mfl{flex:1;}
.ba{background:#e8c97e;color:#0c0c0e;border:none;border-radius:8px;padding:7px 15px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;transition:all var(--t);}
.ba:hover{background:#d4a74a;}
.bg2{background:transparent;color:var(--panel-text2);border:1px solid var(--panel-border);border-radius:8px;padding:6px 13px;font-family:'Instrument Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all var(--t);}
.bg2:hover{background:var(--panel-bg3);color:var(--panel-text);}
.bd{background:rgba(192,57,43,.1);color:#e07070;border:1px solid rgba(192,57,43,.2);border-radius:8px;padding:6px 11px;font-family:'Instrument Sans',sans-serif;font-size:.79rem;cursor:pointer;}
/* POSTIT COLOR PICKER */
.pcp{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.pco{width:28px;height:28px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all var(--t);}
.pco:hover,.pco.sel{border-color:var(--panel-text);transform:scale(1.12);}

/* MISC */
.sp{width:15px;height:15px;border:2px solid var(--panel-border);border-top-color:#e8c97e;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:8px;padding:10px 14px;font-size:.8rem;color:var(--panel-text);z-index:500;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:fiu .16s ease;}
@keyframes fiu{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
.bs{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;padding:5px 9px;color:var(--panel-text2);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:.75rem;transition:all var(--t);}
.bs:hover{background:var(--panel-bg4);color:var(--panel-text);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <h1>Mis <em>Proyectos</em></h1>
    <p>Ingresá tu clave para acceder</p>
    <input type="password" id="lpin" class="lfi" placeholder="••••••••••" autocomplete="off" style="letter-spacing:.1em">
    <div class="lerr" id="lerr">Clave incorrecta</div>
    <button class="lbtn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">Proyectos ✦</div>
    <div class="tb-sep"></div>
    <div class="tb-actions">
      <button class="tb-btn accent" onclick="openNewItem()">＋ Nuevo tema</button>
      <button class="tb-btn" onclick="openNewProj()">＋ Proyecto</button>
      <div class="vis-wrap">
        <button class="tb-btn" id="vis-toggle-btn" onclick="toggleVisMenu()">👁 Mostrar/ocultar</button>
        <div class="vis-dropdown" id="vis-menu" style="display:none"></div>
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" onclick="logout()">Salir</button>
    </div>
  </div>

  <!-- BOARD + DETAIL PANEL -->
  <div class="board-wrap">
    <div class="board" id="board">
      <div style="display:flex;align-items:center;gap:10px;color:#999;font-size:.84rem;padding:20px"><div class="sp"></div> Cargando...</div>
    </div>
    <div id="dpanel">
      <div class="dp-top">
        <span>Detalle</span>
        <button class="dp-close" onclick="closeDetail()">✕ Cerrar</button>
      </div>
      <div class="dp-scroll">
        <input class="dp-tit" id="dp-tit" placeholder="Título...">
        <div class="dp-sec">Notas / Desarrollo</div>
        <textarea class="dp-notes" id="dp-notes" placeholder="Desarrollá esta idea libremente..."></textarea>
        <div class="dp-sec">Post-its secundarios</div>
        <div class="sub-list" id="sub-list"></div>
        <div class="sub-add-row">
          <input class="sub-inp" id="sub-inp" placeholder="Agregar... (Enter)">
          <button class="bs" onclick="addSub()">＋</button>
        </div>
        <div class="dp-sec" style="margin-top:18px">Detalles</div>
        <div class="dp-meta">
          <div class="dp-meta-row">
            <span class="dp-meta-lbl">Proyecto</span>
            <select class="fi-sm" id="dp-proj" style="flex:1"></select>
          </div>
          <div class="dp-meta-row">
            <span class="dp-meta-lbl">Fecha</span>
            <input class="fi-sm" type="date" id="dp-date">
          </div>
          <div class="dp-meta-row">
            <span class="dp-meta-lbl">Etiqueta</span>
            <input class="fi-sm" id="dp-tag" placeholder="ej. urgente...">
          </div>
          <div class="dp-meta-row">
            <span class="dp-meta-lbl">Color</span>
            <div class="cp-sm" id="dp-cp"></div>
          </div>
        </div>
        <button class="dp-save" onclick="saveDet()">Guardar cambios</button>
        <button class="dp-del" onclick="delDet()">Eliminar tema</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Proyecto -->
<div class="mo" id="m-proj">
  <div class="md">
    <div class="mh"><span class="mt" id="mp-t">Nuevo proyecto</span><button class="mx" onclick="closeM('m-proj')">✕</button></div>
    <div class="fg"><label class="fl">Nombre</label><input class="fi" id="mp-name" placeholder="ej. Vesuvio, LMPiletas..."></div>
    <div class="fg"><label class="fl">Descripción</label><textarea class="fi" id="mp-desc" placeholder="Opcional..."></textarea></div>
    <div class="fg"><label class="fl">Ícono</label><div class="ep" id="ep"></div></div>
    <div class="mf">
      <div class="mfl"><button class="bd" id="mp-del" style="display:none" onclick="deleteProj()">Eliminar proyecto</button></div>
      <button class="bg2" onclick="closeM('m-proj')">Cancelar</button>
      <button class="ba" onclick="saveProj()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: Nuevo/Editar Tema -->
<div class="mo" id="m-item">
  <div class="md">
    <div class="mh"><span class="mt" id="mi-t">Nuevo tema</span><button class="mx" onclick="closeM('m-item')">✕</button></div>
    <div class="fg"><label class="fl">Título</label><input class="fi" id="mi-tit" placeholder="Título del tema"></div>
    <div class="fg"><label class="fl">Descripción corta</label><textarea class="fi" id="mi-desc" placeholder="Se ve en el post-it..." style="min-height:48px"></textarea></div>
    <div class="fg"><label class="fl">Proyecto</label><select class="fi" id="mi-proj"></select></div>
    <div class="fg"><label class="fl">Fecha</label><input class="fi" type="date" id="mi-date"></div>
    <div class="fg"><label class="fl">Etiqueta</label><input class="fi" id="mi-tag" placeholder="ej. urgente, reunión..."></div>
    <div class="fg"><label class="fl">Color del post-it</label><div class="pcp" id="item-cp"></div></div>
    <div class="mf">
      <div class="mfl"><button class="bd" id="mi-del" style="display:none" onclick="deleteItem()">Eliminar</button></div>
      <button class="bg2" onclick="closeM('m-item')">Cancelar</button>
      <button class="ba" onclick="saveItem()">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore,collection,doc,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp,query,orderBy,writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey:"AIzaSyCWZniGvRktycwnOmjQIX-wEvjrPhY-EOM",
  authDomain:"proyectoslauti.firebaseapp.com",
  projectId:"proyectoslauti",
  storageBucket:"proyectoslauti.firebasestorage.app",
  messagingSenderId:"593302100716",
  appId:"1:593302100716:web:4d9c0d3a8f34679528a3c9"
}));

const CODE="lautarom123";
const POSTIT_COLORS=[
  {key:"yellow",bg:"#fef08a",label:"Amarillo"},
  {key:"orange",bg:"#fdba74",label:"Naranja"},
  {key:"red",bg:"#fca5a5",label:"Rojo"},
  {key:"pink",bg:"#f9a8d4",label:"Rosa"},
  {key:"purple",bg:"#d8b4fe",label:"Violeta"},
  {key:"blue",bg:"#93c5fd",label:"Azul"},
  {key:"teal",bg:"#5eead4",label:"Teal"},
  {key:"green",bg:"#86efac",label:"Verde"},
  {key:"white",bg:"#f8f8f4",label:"Blanco"},
];
const EMOJIS=["🚀","📋","💼","🏠","🎯","📊","💡","🔧","🍕","📦","🗂️","⭐","🌟","🔥","💰","📅","🎨","📝","🏗️","🎪"];
const DET_COLORS=["#e8c97e","#e07070","#6ec97a","#7ab8e0","#c97edd","#e0a87a","#7ec9c9","#8ec97e"];

let projects=[], items=[], hiddenProjs=new Set(), detId=null, ePid=null, eIid=null, sEmoji=EMOJIS[0], sItemColor="yellow", sDetColor=DET_COLORS[0];

const g=id=>document.getElementById(id);
const mk=(tag,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;return e;};
const esc=s=>s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):"";

// ── Login ──
window.doLogin=()=>{
  if(g("lpin").value===CODE){
    g("login").style.display="none";
    g("app").style.display="flex";
    g("app").style.flexDirection="column";
    g("app").style.height="100vh";
    loadAll();
  } else { g("lerr").style.display="block"; g("lpin").value=""; }
};
g("lpin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
window.logout=()=>{g("app").style.display="none";g("login").style.display="flex";};

// ── Load ──
async function loadAll(){
  g("board").innerHTML='<div style="display:flex;align-items:center;gap:10px;color:#999;font-size:.84rem;padding:20px"><div class="sp"></div> Cargando...</div>';
  try{
    let ps;
    try{ ps=await getDocs(query(collection(db,"projects"),orderBy("createdAt","asc"))); }
    catch(_){ ps=await getDocs(collection(db,"projects")); }
    projects=[];
    ps.forEach(d=>projects.push({id:d.id,...d.data()}));

    // load all items for all projects in parallel
    const itemSnaps=await Promise.all(projects.map(p=>{
      return getDocs(collection(db,"projects",p.id,"items")).catch(()=>null);
    }));
    items=[];
    itemSnaps.forEach((snap,i)=>{
      if(!snap)return;
      snap.forEach(d=>items.push({id:d.id,projId:projects[i].id,...d.data()}));
    });

    // restore hidden from localStorage
    const saved=localStorage.getItem("hiddenProjs");
    if(saved) hiddenProjs=new Set(JSON.parse(saved));

    renderBoard();
    buildVisMenu();
  } catch(e){
    g("board").innerHTML='<div style="padding:20px;color:#999">Error: '+e.message+'</div>';
  }
}

// ── Board ──
function renderBoard(){
  const board=g("board"); board.innerHTML="";
  const visible=projects.filter(p=>!hiddenProjs.has(p.id));
  if(!visible.length){
    board.innerHTML='<div style="padding:40px;color:var(--text3);font-size:.86rem">Todos los proyectos están ocultos. Usá "Mostrar/ocultar" para verlos.</div>';
    return;
  }
  visible.forEach(proj=>{
    const projItems=items.filter(i=>i.projId===proj.id);
    const col=mk("div","proj-col");

    // Column header
    const hdr=mk("div","proj-col-header");
    hdr.innerHTML=
      '<div class="proj-col-name"><span class="proj-col-emoji">'+(proj.emoji||"📋")+'</span>'+esc(proj.name)+'</div>'+
      '<div class="proj-col-acts">'+
        '<button class="pcol-btn" title="Editar" onclick="openEditProj(\''+proj.id+'\')">✏️</button>'+
      '</div>';
    col.appendChild(hdr);

    // Items
    const itemsWrap=mk("div","proj-items");
    projItems.forEach(item=>{
      itemsWrap.appendChild(mkPostit(item));
    });

    // Add button
    const addBtn=mk("button","add-postit-btn");
    addBtn.textContent="＋ Agregar tema";
    addBtn.onclick=()=>openNewItemForProj(proj.id);
    itemsWrap.appendChild(addBtn);
    col.appendChild(itemsWrap);
    board.appendChild(col);
  });
}

function mkPostit(item){
  const colorObj=POSTIT_COLORS.find(c=>c.key===item.color)||POSTIT_COLORS[0];
  const card=mk("div","postit"+(detId===item.id?" active-det":""));
  card.style.background=colorObj.bg;
  const dc=getDC(item.date);
  const subs=item.subs||[];
  const doneSubs=subs.filter(s=>s.done).length;

  let html='<button class="postit-edit" onclick="event.stopPropagation();openEditItem(\''+item.id+'\')">✏️</button>';
  html+='<div class="postit-title">'+esc(item.title)+'</div>';
  if(item.desc) html+='<div class="postit-desc">'+esc(item.desc.substring(0,80))+(item.desc.length>80?"…":"")+'</div>';

  if(subs.length){
    html+='<div class="postit-subs">';
    subs.slice(0,5).forEach((s,idx)=>{
      html+='<div class="sub-chip'+(s.done?" done":"")+'">'+
        '<div class="sub-dot'+(s.done?" done":"")+'\" onclick=\"event.stopPropagation();toggleSubFromCard(\''+item.id+'\','+idx+')\">'+
        (s.done?"✓":"")+
        '</div>'+
        esc(s.text.substring(0,18))+(s.text.length>18?"…":"")+
        '</div>';
    });
    if(subs.length>5) html+='<div class="sub-chip">+'+(subs.length-5)+' más</div>';
    html+='</div>';
  }

  const hasMeta=item.date||item.tag||subs.length;
  if(hasMeta){
    html+='<div class="postit-footer">';
    html+=item.date?'<span class="postit-date '+dc+'">📅 '+item.date+'</span>':'<span></span>';
    if(subs.length) html+='<span class="postit-tag">'+doneSubs+'/'+subs.length+' ✓</span>';
    else if(item.tag) html+='<span class="postit-tag">'+esc(item.tag)+'</span>';
    html+='</div>';
  }

  card.innerHTML=html;
  card.onclick=()=>openDetail(item.id);
  return card;
}

// ── Visibility menu ──
function buildVisMenu(){
  const menu=g("vis-menu"); menu.innerHTML="";
  projects.forEach(p=>{
    const isHidden=hiddenProjs.has(p.id);
    const row=mk("div","vis-item");
    row.innerHTML=
      '<div class="vis-check'+(isHidden?"":" on")+'">'+(isHidden?"":"✓")+'</div>'+
      '<span style="font-size:1rem">'+(p.emoji||"📋")+'</span>'+
      '<span class="vis-label">'+esc(p.name)+'</span>';
    row.onclick=()=>{
      if(hiddenProjs.has(p.id)) hiddenProjs.delete(p.id);
      else hiddenProjs.add(p.id);
      localStorage.setItem("hiddenProjs",JSON.stringify([...hiddenProjs]));
      buildVisMenu(); renderBoard();
    };
    menu.appendChild(row);
  });
}

window.toggleVisMenu=()=>{
  const m=g("vis-menu");
  m.style.display=m.style.display==="none"?"flex":"none";
  if(m.style.display==="flex") m.style.flexDirection="column";
};
document.addEventListener("click",e=>{
  const wrap=document.querySelector(".vis-wrap");
  if(wrap&&!wrap.contains(e.target)) g("vis-menu").style.display="none";
});

// ── Detail Panel ──
window.openDetail=itemId=>{
  const item=items.find(i=>i.id===itemId); if(!item)return;
  detId=itemId; sDetColor=item.detColor||DET_COLORS[0];
  g("dp-tit").value=item.title;
  g("dp-notes").value=item.notes||"";
  g("dp-date").value=item.date||"";
  g("dp-tag").value=item.tag||"";
  // populate project select
  const ps=g("dp-proj"); ps.innerHTML="";
  projects.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=(p.emoji||"")+" "+p.name;if(p.id===item.projId)o.selected=true;ps.appendChild(o);});
  buildDetCP();
  renderSubList(item);
  g("dpanel").classList.add("open");
  renderBoard();
};
window.closeDetail=()=>{ detId=null; g("dpanel").classList.remove("open"); renderBoard(); };

function renderSubList(item){
  const list=g("sub-list"); list.innerHTML="";
  const subs=item.subs||[];
  if(!subs.length){ list.innerHTML='<div style="color:var(--panel-text3);font-size:.78rem;padding:3px 0">Sin post-its secundarios aún.</div>'; return; }
  subs.forEach((s,idx)=>{
    const row=mk("div","sub-row");
    const chk=mk("div","sub-chk"+(s.done?" done":""));
    chk.textContent=s.done?"✓":""; chk.onclick=()=>toggleSub(item.id,idx);
    const txt=mk("div","sub-txt"+(s.done?" done":"")); txt.textContent=s.text;
    const del=mk("button","sub-del"); del.textContent="✕"; del.onclick=()=>deleteSub(item.id,idx);
    row.appendChild(chk); row.appendChild(txt); row.appendChild(del);
    list.appendChild(row);
  });
}

async function toggleSub(itemId,idx){
  const item=items.find(i=>i.id===itemId); if(!item)return;
  const subs=[...(item.subs||[])]; subs[idx]={...subs[idx],done:!subs[idx].done};
  try{ await updateDoc(doc(db,"projects",item.projId,"items",itemId),{subs}); item.subs=subs; renderSubList(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
}
async function deleteSub(itemId,idx){
  const item=items.find(i=>i.id===itemId); if(!item)return;
  const subs=[...(item.subs||[])]; subs.splice(idx,1);
  try{ await updateDoc(doc(db,"projects",item.projId,"items",itemId),{subs}); item.subs=subs; renderSubList(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
}
window.toggleSubFromCard=(itemId,idx)=>toggleSub(itemId,idx);

window.addSub=async()=>{
  if(!detId)return;
  const inp=g("sub-inp"); const text=inp.value.trim(); if(!text)return;
  const item=items.find(i=>i.id===detId); if(!item)return;
  const subs=[...(item.subs||[]),{text,done:false}];
  try{ await updateDoc(doc(db,"projects",item.projId,"items",detId),{subs}); item.subs=subs; inp.value=""; renderSubList(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
};
g("sub-inp").addEventListener("keydown",e=>{ if(e.key==="Enter") addSub(); });

window.saveDet=async()=>{
  if(!detId)return;
  const title=g("dp-tit").value.trim(); if(!title)return toast("Ingresá un título");
  const item=items.find(i=>i.id===detId); if(!item)return;
  const newProjId=g("dp-proj").value;
  const data={title,notes:g("dp-notes").value.trim(),date:g("dp-date").value||null,tag:g("dp-tag").value.trim(),detColor:sDetColor};
  try{
    if(newProjId!==item.projId){
      // move to different project
      const newRef=await addDoc(collection(db,"projects",newProjId,"items"),{...item,...data,projId:newProjId,createdAt:serverTimestamp()});
      await deleteDoc(doc(db,"projects",item.projId,"items",detId));
      items=items.filter(i=>i.id!==detId);
      items.push({...item,...data,id:newRef.id,projId:newProjId});
      detId=newRef.id;
    } else {
      await updateDoc(doc(db,"projects",item.projId,"items",detId),data);
      Object.assign(item,data);
    }
    renderBoard(); toast("Guardado ✓");
  } catch(e){ toast("Error: "+e.message); }
};

window.delDet=async()=>{
  if(!detId)return; if(!confirm("¿Eliminar este tema?"))return;
  const item=items.find(i=>i.id===detId); if(!item)return;
  try{
    await deleteDoc(doc(db,"projects",item.projId,"items",detId));
    items=items.filter(i=>i.id!==detId);
    closeDetail(); toast("Tema eliminado");
  } catch(e){ toast("Error: "+e.message); }
};

// ── Projects CRUD ──
window.openNewProj=()=>{ ePid=null; g("mp-t").textContent="Nuevo proyecto"; g("mp-name").value=""; g("mp-desc").value=""; g("mp-del").style.display="none"; sEmoji=EMOJIS[0]; buildEP(); openM("m-proj"); };
window.openEditProj=id=>{ const p=projects.find(p=>p.id===id); if(!p)return; ePid=id; g("mp-t").textContent="Editar proyecto"; g("mp-name").value=p.name; g("mp-desc").value=p.desc||""; g("mp-del").style.display="inline-block"; sEmoji=p.emoji||EMOJIS[0]; buildEP(); openM("m-proj"); };
window.saveProj=async()=>{
  const name=g("mp-name").value.trim(); if(!name)return toast("Ingresá un nombre");
  const desc=g("mp-desc").value.trim();
  try{
    if(ePid){ await updateDoc(doc(db,"projects",ePid),{name,desc,emoji:sEmoji}); const p=projects.find(p=>p.id===ePid); if(p){p.name=name;p.desc=desc;p.emoji=sEmoji;} toast("Actualizado ✓"); }
    else { const r=await addDoc(collection(db,"projects"),{name,desc,emoji:sEmoji,createdAt:serverTimestamp()}); projects.push({id:r.id,name,desc,emoji:sEmoji}); toast("Proyecto creado ✓"); }
    closeM("m-proj"); buildVisMenu(); renderBoard();
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteProj=async()=>{
  if(!ePid)return; if(!confirm("¿Eliminar el proyecto y todos sus temas?"))return;
  try{
    const projItems=items.filter(i=>i.projId===ePid);
    await Promise.all(projItems.map(i=>deleteDoc(doc(db,"projects",ePid,"items",i.id))));
    await deleteDoc(doc(db,"projects",ePid));
    projects=projects.filter(p=>p.id!==ePid);
    items=items.filter(i=>i.projId!==ePid);
    hiddenProjs.delete(ePid);
    closeM("m-proj"); buildVisMenu(); renderBoard(); toast("Proyecto eliminado");
  } catch(e){ toast("Error: "+e.message); }
};

// ── Items CRUD ──
function popProjSel(selId,elId){ const s=g(elId); s.innerHTML=""; projects.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=(p.emoji||"")+" "+p.name;if(p.id===selId)o.selected=true;s.appendChild(o);}); }
window.openNewItem=()=>{ eIid=null; g("mi-t").textContent="Nuevo tema"; ["mi-tit","mi-tag"].forEach(id=>g(id).value=""); g("mi-desc").value=""; g("mi-date").value=""; g("mi-del").style.display="none"; sItemColor="yellow"; popProjSel(null,"mi-proj"); buildItemCP(); openM("m-item"); };
window.openNewItemForProj=projId=>{ eIid=null; g("mi-t").textContent="Nuevo tema"; ["mi-tit","mi-tag"].forEach(id=>g(id).value=""); g("mi-desc").value=""; g("mi-date").value=""; g("mi-del").style.display="none"; sItemColor="yellow"; popProjSel(projId,"mi-proj"); buildItemCP(); openM("m-item"); };
window.openEditItem=itemId=>{ const item=items.find(i=>i.id===itemId); if(!item)return; eIid=itemId; g("mi-t").textContent="Editar tema"; g("mi-tit").value=item.title; g("mi-desc").value=item.desc||""; g("mi-date").value=item.date||""; g("mi-tag").value=item.tag||""; g("mi-del").style.display="inline-block"; sItemColor=item.color||"yellow"; popProjSel(item.projId,"mi-proj"); buildItemCP(); openM("m-item"); };
window.saveItem=async()=>{
  const title=g("mi-tit").value.trim(); if(!title)return toast("Ingresá un título");
  const projId=g("mi-proj").value; if(!projId)return toast("Seleccioná un proyecto");
  const data={title,desc:g("mi-desc").value.trim(),date:g("mi-date").value||null,tag:g("mi-tag").value.trim(),color:sItemColor};
  try{
    if(eIid){
      const item=items.find(i=>i.id===eIid); if(!item)return;
      if(projId!==item.projId){
        const r=await addDoc(collection(db,"projects",projId,"items"),{...data,notes:item.notes||"",subs:item.subs||[],projId,createdAt:serverTimestamp()});
        await deleteDoc(doc(db,"projects",item.projId,"items",eIid));
        items=items.filter(i=>i.id!==eIid);
        items.push({id:r.id,...data,notes:item.notes||"",subs:item.subs||[],projId});
      } else {
        await updateDoc(doc(db,"projects",projId,"items",eIid),data);
        Object.assign(item,data);
      }
      toast("Tema actualizado ✓");
    } else {
      const r=await addDoc(collection(db,"projects",projId,"items"),{...data,notes:"",subs:[],projId,createdAt:serverTimestamp()});
      items.push({id:r.id,...data,notes:"",subs:[],projId});
      toast("Tema creado ✓");
    }
    closeM("m-item"); renderBoard();
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteItem=async()=>{
  if(!eIid)return; if(!confirm("¿Eliminar este tema?"))return;
  const item=items.find(i=>i.id===eIid); if(!item)return;
  try{
    await deleteDoc(doc(db,"projects",item.projId,"items",eIid));
    items=items.filter(i=>i.id!==eIid);
    if(detId===eIid) closeDetail();
    closeM("m-item"); renderBoard(); toast("Tema eliminado");
  } catch(e){ toast("Error: "+e.message); }
};

// ── Pickers ──
function buildEP(){ const c=g("ep"); c.innerHTML=""; EMOJIS.forEach(e=>{const s=mk("span","eo"+(e===sEmoji?" sel":""));s.textContent=e;s.onclick=()=>{sEmoji=e;c.querySelectorAll(".eo").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");};c.appendChild(s);}); }
function buildItemCP(){
  const c=g("item-cp"); c.innerHTML="";
  POSTIT_COLORS.forEach(col=>{
    const d=mk("div","pco"+(col.key===sItemColor?" sel":""));
    d.style.background=col.bg; d.title=col.label;
    d.onclick=()=>{ sItemColor=col.key; c.querySelectorAll(".pco").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); };
    c.appendChild(d);
  });
}
function buildDetCP(){
  const c=g("dp-cp"); c.innerHTML="";
  DET_COLORS.forEach(col=>{
    const d=mk("div","co-sm"+(col===sDetColor?" sel":""));
    d.style.background=col;
    d.onclick=()=>{ sDetColor=col; c.querySelectorAll(".co-sm").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); };
    c.appendChild(d);
  });
}

// ── Modals ──
window.openM=id=>g(id).classList.add("open");
window.closeM=id=>g(id).classList.remove("open");
document.querySelectorAll(".mo").forEach(o=>o.addEventListener("click",e=>{ if(e.target===o) o.classList.remove("open"); }));

function toast(msg){ const t=mk("div","toast"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function getDC(ds){ if(!ds)return""; const d=new Date(ds+"T00:00:00"),n=new Date(); n.setHours(0,0,0,0); const df=(d-n)/86400000; return df<0?"ov":df<=3?"sn":""; }

buildEP(); buildItemCP(); buildDetCP();
</script>
</body>
</html>
