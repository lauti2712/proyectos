<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — Lauti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ede9df;--bg2:#f5f2eb;--bg3:#e2ddd3;--bg4:#d4cfc4;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --text:#1a1710;--text2:#6b6456;--text3:#a09880;
  --panel:#1c1c1f;--panel-text:#f0ede8;--panel-text2:#9d9a94;--panel-text3:#5c5a56;
  --panel-border:rgba(255,255,255,0.07);--panel-border2:rgba(255,255,255,0.14);
  --panel-bg2:#141416;--panel-bg3:#1c1c1f;--panel-bg4:#242428;
  --danger:#c0392b;--gold:#e8c97e;--t:.15s ease;
  --ps:2px 4px 10px rgba(0,0,0,0.2);
}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;min-height:100vh;overflow:hidden;}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--panel);}
.lcard{background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:20px;padding:52px 44px;width:100%;max-width:400px;}
.lcard h1{font-family:'DM Serif Display',serif;font-size:2.2rem;margin-bottom:6px;color:var(--panel-text);}
.lcard h1 em{color:var(--gold);font-style:italic;}
.lcard p{color:var(--panel-text2);font-size:.88rem;margin-bottom:28px;}
.lerr{color:#e07070;font-size:.82rem;margin-bottom:10px;display:none;}
.lfi{width:100%;background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:10px 13px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.88rem;outline:none;margin-bottom:11px;letter-spacing:.1em;}
.lfi:focus{border-color:var(--gold);}
.lfi::placeholder{color:var(--panel-text3);letter-spacing:normal;}
.lbtn{width:100%;background:var(--gold);color:#0c0c0e;border:none;border-radius:8px;padding:13px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.92rem;cursor:pointer;}
.lbtn:hover{background:#d4a74a;}

/* APP */
#app{display:none;height:100vh;flex-direction:column;}

/* TOP BAR */
.topbar{background:var(--panel);border-bottom:1px solid var(--panel-border);display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;flex-shrink:0;}
.logo{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--gold);font-style:italic;white-space:nowrap;margin-right:4px;}
.tb-sep{width:1px;height:22px;background:var(--panel-border2);flex-shrink:0;}
.tb-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:.77rem;font-weight:500;cursor:pointer;border:1px solid var(--panel-border);background:transparent;color:var(--panel-text2);font-family:'Instrument Sans',sans-serif;transition:all var(--t);white-space:nowrap;}
.tb-btn:hover{background:var(--panel-bg3);color:var(--panel-text);}
.tb-btn.gold{background:var(--gold);color:#0c0c0e;border-color:var(--gold);}
.tb-btn.gold:hover{background:#d4a74a;}
.tb-right{margin-left:auto;display:flex;gap:6px;}

/* VIS DROPDOWN */
.vis-wrap{position:relative;}
.vis-dd{position:absolute;top:calc(100%+7px);left:0;background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:12px;padding:9px;min-width:210px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;flex-direction:column;animation:fiu .15s ease;}
.vis-dd.open{display:flex;}
.vis-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background var(--t);}
.vis-item:hover{background:var(--panel-bg3);}
.vis-chk{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--panel-text3);display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;}
.vis-chk.on{background:var(--gold);border-color:var(--gold);color:#0c0c0e;}
.vis-lbl{font-size:.81rem;color:var(--panel-text2);}

/* BOARD */
.board-wrap{flex:1;display:flex;overflow:hidden;}
.board{flex:1;overflow-x:auto;overflow-y:hidden;padding:18px 18px 18px;display:flex;gap:18px;align-items:flex-start;}
.board::-webkit-scrollbar{height:5px;}
.board::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}

/* PROJECT COLUMN */
.proj-col{display:flex;flex-direction:column;gap:0;flex-shrink:0;width:220px;}
.proj-col-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
.proj-col-name{font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:6px;color:var(--text);}
.proj-col-acts{display:flex;gap:2px;opacity:0;transition:opacity var(--t);}
.proj-col:hover .proj-col-acts{opacity:1;}
.pcol-btn{background:transparent;border:none;color:var(--text3);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.72rem;}
.pcol-btn:hover{background:var(--bg3);color:var(--text);}
.proj-items{display:flex;flex-direction:column;gap:10px;}

/* POST-IT BASE */
.pi{border-radius:3px;cursor:pointer;transition:transform var(--t),box-shadow var(--t);position:relative;box-shadow:var(--ps);}
.pi::before{content:'';position:absolute;top:0;left:0;right:0;height:20px;background:rgba(0,0,0,0.055);border-radius:3px 3px 0 0;pointer-events:none;}
.pi:hover{transform:translateY(-2px) rotate(.3deg);box-shadow:3px 6px 16px rgba(0,0,0,.22);}
.pi.active{box-shadow:0 0 0 2.5px #1a1710,var(--ps);transform:translateY(-2px);}

/* SIZE VARIANTS */
.pi.sz-normal{padding:11px 12px 10px;min-height:80px;}
.pi.sz-tall{padding:11px 12px 10px;min-height:160px;}

/* POSTIT COLORS */
.pi.c-yellow{background:#fef08a;}
.pi.c-orange{background:#fdba74;}
.pi.c-red{background:#fca5a5;}
.pi.c-pink{background:#f9a8d4;}
.pi.c-purple{background:#d8b4fe;}
.pi.c-blue{background:#93c5fd;}
.pi.c-teal{background:#5eead4;}
.pi.c-green{background:#86efac;}
.pi.c-white{background:#f8f8f4;}

.pi-title{font-weight:700;font-size:.84rem;line-height:1.35;margin-bottom:4px;padding-top:3px;color:#1a1710;}
.pi-desc{font-size:.72rem;color:#4a4030;line-height:1.45;margin-bottom:5px;}

/* STICKY NOTES (type=sticky) overlaid */
.stickies-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;}
.sticky{background:rgba(255,255,255,0.55);border-radius:3px;padding:3px 7px;font-size:.69rem;color:#3a3020;line-height:1.3;display:flex;align-items:center;gap:4px;border:1px solid rgba(0,0,0,0.1);}
.sticky.full-sticky{background:rgba(255,255,255,0.8);border-radius:3px;padding:4px 8px;font-size:.72rem;}
.sticky-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* SUB CHIPS (type=subtema) */
.subs-wrap{display:flex;flex-direction:column;gap:3px;margin-bottom:5px;}
.sub-chip2{background:rgba(0,0,0,0.09);border-radius:3px;padding:3px 7px;font-size:.69rem;color:#3a3020;display:flex;align-items:center;gap:4px;}
.sub-chk-mini{width:9px;height:9px;border-radius:2px;border:1px solid #6a5a40;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.52rem;cursor:pointer;}
.sub-chk-mini.done{background:#6a5a40;color:#fff;}
.sub-chip2.done span{text-decoration:line-through;opacity:.5;}

/* DATES ON POSTIT */
.pi-dates{font-size:.67rem;color:#6a5a40;font-family:'DM Mono',monospace;margin-bottom:3px;line-height:1.4;}
.pi-dates.ov{color:#c0392b;}
.pi-dates.sn{color:#8B6914;}
.pi-progress{height:3px;background:rgba(0,0,0,0.12);border-radius:2px;margin-bottom:5px;overflow:hidden;}
.pi-progress-fill{height:100%;background:rgba(0,0,0,0.3);border-radius:2px;transition:width .3s;}

.pi-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:4px;}
.pi-tag{font-size:.65rem;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,0.1);color:#3a3020;}
.pi-edit{position:absolute;top:4px;right:5px;background:rgba(0,0,0,0.12);border:none;border-radius:3px;color:#3a3020;cursor:pointer;padding:2px 5px;font-size:.63rem;opacity:0;transition:opacity var(--t);z-index:2;}
.pi:hover .pi-edit{opacity:1;}

/* ADD BTN */
.add-pi-btn{background:transparent;border:1.5px dashed var(--bg4);border-radius:3px;padding:7px 11px;color:var(--text3);cursor:pointer;font-size:.77rem;font-family:'Instrument Sans',sans-serif;transition:all var(--t);text-align:left;width:100%;margin-top:2px;}
.add-pi-btn:hover{border-color:var(--text2);color:var(--text2);}

/* DETAIL PANEL */
#dpanel{width:0;flex-shrink:0;background:var(--panel);overflow:hidden;transition:width .2s ease;display:flex;flex-direction:column;}
#dpanel.open{width:370px;border-left:1px solid var(--panel-border);}
.dp-top{padding:14px 17px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.dp-top-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--panel-text3);}
.dp-close{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;color:var(--panel-text2);cursor:pointer;padding:4px 9px;font-size:.77rem;font-family:'Instrument Sans',sans-serif;}
.dp-close:hover{color:var(--panel-text);}
.dp-scroll{flex:1;overflow-y:auto;padding:17px;}
.dp-tit{font-family:'DM Serif Display',serif;font-size:1.38rem;background:none;border:none;border-bottom:1px solid transparent;outline:none;color:var(--panel-text);width:100%;margin-bottom:11px;transition:border-color var(--t);line-height:1.35;}
.dp-tit:focus{border-bottom-color:var(--gold);}
.dp-notes{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:9px 12px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.83rem;width:100%;outline:none;resize:none;min-height:90px;line-height:1.6;transition:border-color var(--t);}
.dp-notes:focus{border-color:var(--gold);}
.dp-notes::placeholder{color:var(--panel-text3);}
.dp-sec{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--panel-text3);margin:16px 0 7px;}
/* children list */
.children-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.child-row{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:7px;padding:7px 10px;display:flex;align-items:flex-start;gap:7px;cursor:pointer;transition:border-color var(--t);}
.child-row:hover{border-color:var(--panel-border2);}
.child-chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--panel-text3);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;transition:all var(--t);}
.child-chk.done{background:var(--gold);border-color:var(--gold);color:#0c0c0e;}
.child-body{flex:1;min-width:0;}
.child-type{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--panel-text3);margin-bottom:2px;}
.child-title{font-size:.81rem;color:var(--panel-text);line-height:1.35;}
.child-title.done{text-decoration:line-through;opacity:.45;}
.child-expand{font-size:.68rem;color:var(--gold);margin-top:2px;}
.child-del{background:none;border:none;color:var(--panel-text3);cursor:pointer;font-size:.68rem;padding:0 2px;flex-shrink:0;}
.child-del:hover{color:#e07070;}
/* add child */
.add-child-wrap{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:10px;margin-bottom:8px;}
.add-child-type{display:flex;gap:6px;margin-bottom:8px;}
.type-btn{flex:1;padding:5px 8px;border-radius:6px;font-size:.75rem;font-weight:500;cursor:pointer;border:1px solid var(--panel-border);background:transparent;color:var(--panel-text3);font-family:'Instrument Sans',sans-serif;transition:all var(--t);text-align:center;}
.type-btn.on{background:rgba(232,201,126,.15);border-color:var(--gold);color:var(--gold);}
.add-child-inp{width:100%;background:var(--panel-bg4);border:1px solid var(--panel-border);border-radius:6px;padding:7px 10px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.81rem;outline:none;margin-bottom:7px;transition:border-color var(--t);}
.add-child-inp:focus{border-color:var(--gold);}
.add-child-inp::placeholder{color:var(--panel-text3);}
.add-child-btn{width:100%;background:var(--panel-bg4);border:1px solid var(--panel-border);border-radius:6px;padding:6px;color:var(--panel-text2);font-family:'Instrument Sans',sans-serif;font-size:.78rem;cursor:pointer;transition:all var(--t);}
.add-child-btn:hover{background:var(--gold);color:#0c0c0e;border-color:var(--gold);}
/* meta */
.dp-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:13px;}
.dp-mr{display:flex;align-items:center;gap:9px;}
.dp-ml{font-size:.7rem;color:var(--panel-text3);width:58px;flex-shrink:0;}
.fi-sm{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;padding:5px 8px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.79rem;outline:none;flex:1;transition:border-color var(--t);}
.fi-sm:focus{border-color:var(--gold);}
.fi-sm::placeholder{color:var(--panel-text3);}
.cp-sm{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.co-sm{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all var(--t);}
.co-sm:hover,.co-sm.sel{border-color:var(--panel-text);transform:scale(1.18);}
.dp-save{width:100%;background:var(--gold);color:#0c0c0e;border:none;border-radius:8px;padding:9px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;margin-top:13px;transition:background var(--t);}
.dp-save:hover{background:#d4a74a;}
.dp-del{width:100%;background:rgba(192,57,43,.1);color:#e07070;border:1px solid rgba(192,57,43,.2);border-radius:8px;padding:7px;font-family:'Instrument Sans',sans-serif;font-size:.78rem;cursor:pointer;margin-top:5px;}
.dp-del:hover{background:rgba(192,57,43,.2);}

/* MODALS */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.md{background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:18px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:su .16s ease;}
@keyframes su{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.mt{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--panel-text);}
.mx{background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:6px;color:var(--panel-text2);cursor:pointer;padding:3px 8px;font-size:.8rem;}
.fg{margin-bottom:12px;}
.fl{display:block;font-size:.72rem;font-weight:600;color:var(--panel-text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;}
.fi{width:100%;background:var(--panel-bg3);border:1px solid var(--panel-border);border-radius:8px;padding:8px 12px;color:var(--panel-text);font-family:'Instrument Sans',sans-serif;font-size:.85rem;outline:none;transition:border-color var(--t);}
.fi:focus{border-color:var(--gold);}
.fi::placeholder{color:var(--panel-text3);}
textarea.fi{resize:vertical;min-height:56px;line-height:1.5;}
.ep{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.eo{font-size:1.2rem;padding:3px 5px;border-radius:5px;cursor:pointer;border:2px solid transparent;background:var(--panel-bg3);}
.eo:hover,.eo.sel{border-color:var(--gold);}
.mf{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:15px;padding-top:12px;border-top:1px solid var(--panel-border);}
.mfl{flex:1;}
.ba{background:var(--gold);color:#0c0c0e;border:none;border-radius:8px;padding:7px 15px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.79rem;cursor:pointer;}
.ba:hover{background:#d4a74a;}
.bg2{background:transparent;color:var(--panel-text2);border:1px solid var(--panel-border);border-radius:8px;padding:6px 12px;font-family:'Instrument Sans',sans-serif;font-size:.79rem;cursor:pointer;}
.bg2:hover{background:var(--panel-bg3);}
.bd{background:rgba(192,57,43,.1);color:#e07070;border:1px solid rgba(192,57,43,.2);border-radius:8px;padding:6px 11px;font-family:'Instrument Sans',sans-serif;font-size:.78rem;cursor:pointer;}

/* POSTIT COLOR PICKER */
.pcp{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.pco{width:26px;height:26px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all var(--t);}
.pco:hover,.pco.sel{border-color:var(--panel-text);transform:scale(1.1);}
/* SIZE PICKER */
.szp{display:flex;gap:7px;margin-top:4px;}
.szb{flex:1;border:1.5px solid var(--panel-border);border-radius:6px;padding:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--panel-text3);font-size:.72rem;font-family:'Instrument Sans',sans-serif;transition:all var(--t);}
.szb:hover{border-color:var(--panel-border2);}
.szb.sel{border-color:var(--gold);color:var(--gold);}
.szb-preview{background:var(--panel-bg4);border-radius:2px;width:32px;}
.sz-normal-prev{height:24px;}
.sz-tall-prev{height:48px;}

/* MISC */
.sp{width:14px;height:14px;border:2px solid var(--panel-border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:16px;right:16px;background:var(--panel-bg2);border:1px solid var(--panel-border2);border-radius:8px;padding:10px 14px;font-size:.79rem;color:var(--panel-text);z-index:500;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:fiu .16s ease;}
@keyframes fiu{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <h1>Mis <em>Proyectos</em></h1>
    <p>Ingresá tu clave para acceder</p>
    <input type="password" id="lpin" class="lfi" placeholder="••••••••••" autocomplete="off">
    <div class="lerr" id="lerr">Clave incorrecta</div>
    <button class="lbtn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="logo">Proyectos ✦</div>
    <div class="tb-sep"></div>
    <button class="tb-btn gold" onclick="openNewItem(null)">＋ Nuevo tema</button>
    <button class="tb-btn" onclick="openNewSticky(null)">📌 Post-it rápido</button>
    <button class="tb-btn" onclick="openNewProj()">＋ Proyecto</button>
    <div class="vis-wrap">
      <button class="tb-btn" onclick="toggleVis()">👁 Mostrar/ocultar</button>
      <div class="vis-dd" id="vis-dd"></div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div style="display:flex;align-items:center;gap:10px;color:var(--text3);font-size:.83rem;padding:20px"><div class="sp"></div> Cargando...</div>
    </div>
    <!-- DETAIL PANEL -->
    <div id="dpanel">
      <div class="dp-top">
        <span class="dp-top-label" id="dp-label">Detalle</span>
        <button class="dp-close" onclick="closeDetail()">✕ Cerrar</button>
      </div>
      <div class="dp-scroll">
        <input class="dp-tit" id="dp-tit" placeholder="Título...">
        <div class="dp-sec">Notas / Desarrollo</div>
        <textarea class="dp-notes" id="dp-notes" placeholder="Desarrollá esta idea..."></textarea>

        <div class="dp-sec">Post-its apoyados</div>
        <div class="children-list" id="children-list"></div>
        <div class="add-child-wrap">
          <div class="add-child-type">
            <div class="type-btn on" id="atype-note" onclick="setChildType('note')">📝 Nota rápida</div>
            <div class="type-btn" id="atype-sub" onclick="setChildType('sub')">🔗 Sub-tema</div>
          </div>
          <input class="add-child-inp" id="child-inp" placeholder="Texto del post-it...">
          <button class="add-child-btn" onclick="addChild()">＋ Agregar</button>
        </div>

        <div class="dp-sec" style="margin-top:16px">Detalles</div>
        <div class="dp-meta">

const PCOLS=[

let projects=[],items=[],stickies=[],hiddenProjs=new Set();
let detId=null,detType="item"; // detType: item | sticky
let ePid=null,eIid=null,eSid=null;
let sEmoji=EMOJIS[0],sItemColor="yellow",sStickyColor="pink",sDetColor=DET_COLORS[0];
let sSize="normal",sDetSize="normal",sChildType="note";

const g=id=>document.getElementById(id);
const mk=(tag,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;return e;};

// ── Login ──
window.doLogin=()=>{

// ── Load ──
async function loadAll(){
  g("board").innerHTML='<div style="display:flex;align-items:center;gap:9px;color:var(--text3);font-size:.83rem;padding:20px"><div class="sp"></div> Cargando...</div>';
  try{
    let ps; try{ps=await getDocs(query(collection(db,"projects"),orderBy("createdAt","asc")));}catch(_){ps=await getDocs(collection(db,"projects"));}
    projects=[]; ps.forEach(d=>projects.push({id:d.id,...d.data()}));
    // load items + stickies for all projects
    items=[]; stickies=[];
    await Promise.all(projects.map(async p=>{
      const [iSnap,sSnap]=await Promise.all([
        getDocs(collection(db,"projects",p.id,"items")).catch(()=>null),
        getDocs(collection(db,"projects",p.id,"stickies")).catch(()=>null)
      ]);
      if(iSnap) iSnap.forEach(d=>items.push({id:d.id,projId:p.id,...d.data()}));
      if(sSnap) sSnap.forEach(d=>stickies.push({id:d.id,projId:p.id,...d.data()}));
    }));
    const saved=localStorage.getItem("hiddenProjs2");
    if(saved) hiddenProjs=new Set(JSON.parse(saved));
    renderBoard(); buildVisDD();
  } catch(e){ g("board").innerHTML='<div style="padding:20px;color:var(--text3)">Error: '+e.message+'</div>'; }
}

// ── Board ──
function renderBoard(){
  const board=g("board"); board.innerHTML="";
  const visible=projects.filter(p=>!hiddenProjs.has(p.id));
  if(!visible.length){ board.innerHTML='<div style="padding:30px;color:var(--text3);font-size:.84rem">Todos los proyectos están ocultos.</div>'; return; }
  visible.forEach(proj=>{
    const projItems=items.filter(i=>i.projId===proj.id);
    const projStickies=stickies.filter(s=>s.projId===proj.id);
    const col=mk("div","proj-col");
    const hdr=mk("div","proj-col-hdr");
    hdr.innerHTML='<div class="proj-col-name"><span style="font-size:1rem">'+(proj.emoji||"📋")+'</span>'+esc(proj.name)+'</div>'+
      '<div class="proj-col-acts"><button class="pcol-btn" onclick="openEditProj(\''+proj.id+'\')">✏️</button></div>';
    col.appendChild(hdr);
    const wrap=mk("div","proj-items");
    // Standalone stickies (not attached to an item)
    projStickies.filter(s=>!s.parentId).forEach(s=>wrap.appendChild(mkStickyCard(s)));
    // Items
    projItems.forEach(item=>{
      const card=mkItemCard(item, projStickies.filter(s=>s.parentId===item.id));
      wrap.appendChild(card);
    });
    const addBtn=mk("button","add-pi-btn");
    addBtn.textContent="＋ Agregar tema";
    addBtn.onclick=()=>openNewItem(proj.id);
    wrap.appendChild(addBtn);
    col.appendChild(wrap);
    board.appendChild(col);
  });
}

function mkItemCard(item, children){
  const bg=colBg(item.color||"yellow");
  const card=mk("div","pi c-"+(item.color||"yellow")+" sz-"+(item.size||"normal")+(detId===item.id&&detType==="item"?" active":""));
  card.style.background=bg;

  let html='<button class="pi-edit" onclick="event.stopPropagation();openEditItem(\''+item.id+'\')">✏️</button>';
  html+='<div class="pi-title">'+esc(item.title)+'</div>';
  if(item.desc) html+='<div class="pi-desc">'+esc(item.desc.substring(0,90))+(item.desc.length>90?"…":"")+'</div>';

  // attached stickies / children from item.children array
  const allChildren=[...(item.children||[]),...children];
  if(allChildren.length){
    // notes
    const notes=allChildren.filter(c=>c.type==="note"||(c.text&&!c.type));
    const subs=allChildren.filter(c=>c.type==="sub");
    if(notes.length){
      html+='<div class="stickies-wrap">';
      notes.slice(0,3).forEach(n=>{
        html+='<div class="sticky">'+esc((n.text||n.title||"").substring(0,28))+'</div>';
      });
      if(notes.length>3) html+='<div class="sticky">+'+( notes.length-3)+'</div>';
      html+='</div>';
    }
    if(subs.length){
      html+='<div class="subs-wrap">';
      subs.slice(0,4).forEach((s,idx)=>{
        const done=s.done||false;
        html+='<div class="sub-chip2'+(done?" done":"")+'">'+
          '<div class="sub-chk-mini'+(done?" done":"")+'\" onclick=\"event.stopPropagation();toggleChild(\''+item.id+'\',\''+idx+'\')\">'+(done?"✓":"")+'</div>'+
          '<span>'+esc((s.text||s.title||"").substring(0,22))+'</span></div>';
      });
      html+='</div>';
    }
  }

  // Dates
  const dateInfo=getDateRange(item.startDate,item.endDate);
  if(dateInfo.label) html+='<div class="pi-dates '+dateInfo.cls+'">'+dateInfo.label+'</div>';
  if(dateInfo.progress!==null) html+='<div class="pi-progress"><div class="pi-progress-fill" style="width:'+dateInfo.progress+'%"></div></div>';

  const hasFooter=item.tag;
  if(hasFooter){
    html+='<div class="pi-footer"><span></span>';
    if(item.tag) html+='<span class="pi-tag">'+esc(item.tag)+'</span>';
    html+='</div>';
  }

  card.innerHTML=html;
  card.onclick=()=>openDetail(item.id,"item");
  return card;
}

function mkStickyCard(s){
  const card=mk("div","pi c-"+(s.color||"pink")+" sz-normal"+(detId===s.id&&detType==="sticky"?" active":""));
  card.style.background=colBg(s.color||"pink");
  card.innerHTML=
    '<button class="pi-edit" onclick="event.stopPropagation();openEditSticky(\''+s.id+'\')">✏️</button>'+
    '<div class="pi-title" style="font-size:.78rem;font-weight:600">📌 '+esc((s.text||"").substring(0,60))+'</div>';
  card.onclick=()=>openEditSticky(s.id);
  return card;
}

// ── Date helpers ──
function getDateRange(start,end){
  if(!start&&!end) return {label:"",cls:"",progress:null};
  const now=new Date(); now.setHours(0,0,0,0);
  let label="",cls="",progress=null;
  if(start&&end){
    const s=new Date(start+"T00:00:00"),e=new Date(end+"T00:00:00");
    const total=(e-s)/86400000, elapsed=(now-s)/86400000;
    const daysLeft=Math.ceil((e-now)/86400000);
    const fmt=d=>d.toLocaleDateString("es-AR",{day:"2-digit",month:"short"});
    label=fmt(s)+" → "+fmt(e)+(daysLeft>=0?" ("+daysLeft+"d)":" (vencido)");
    cls=daysLeft<0?"ov":daysLeft<=3?"sn":"";
    progress=Math.min(100,Math.max(0,Math.round((elapsed/total)*100)));
  } else if(end){
    const e=new Date(end+"T00:00:00"),daysLeft=Math.ceil((e-now)/86400000);
    label="Límite: "+e.toLocaleDateString("es-AR",{day:"2-digit",month:"short"})+(daysLeft>=0?" ("+daysLeft+"d)":" (vencido)");
    cls=daysLeft<0?"ov":daysLeft<=3?"sn":"";
  } else if(start){
    const s=new Date(start+"T00:00:00"),elapsed=Math.ceil((now-s)/86400000);
    label="Inicio: "+s.toLocaleDateString("es-AR",{day:"2-digit",month:"short"})+(elapsed>0?" ("+elapsed+"d)":"");
  }
  return {label,cls,progress};
}

// ── Visibility ──
function buildVisDD(){
  const dd=g("vis-dd"); dd.innerHTML="";
  projects.forEach(p=>{
    const on=!hiddenProjs.has(p.id);
    const row=mk("div","vis-item");
    row.innerHTML='<div class="vis-chk'+(on?" on":"'")+'>'+(on?"✓":"")+'</div><span style="font-size:.95rem">'+(p.emoji||"📋")+'</span><span class="vis-lbl">'+esc(p.name)+'</span>';
    row.onclick=()=>{
      if(hiddenProjs.has(p.id)) hiddenProjs.delete(p.id); else hiddenProjs.add(p.id);
      localStorage.setItem("hiddenProjs2",JSON.stringify([...hiddenProjs]));
      buildVisDD(); renderBoard();
    };
    dd.appendChild(row);
  });
}
window.toggleVis=()=>{ const dd=g("vis-dd"); dd.classList.toggle("open"); };
document.addEventListener("click",e=>{ const w=document.querySelector(".vis-wrap"); if(w&&!w.contains(e.target)) g("vis-dd").classList.remove("open"); });

// ── Detail Panel ──
window.openDetail=(id,type)=>{
  detId=id; detType=type||"item";
  if(type==="item"){
    const item=items.find(i=>i.id===id); if(!item)return;
    g("dp-label").textContent="Tema";
    g("dp-tit").value=item.title;
    g("dp-notes").value=item.notes||"";
    g("dp-start").value=item.startDate||"";
    g("dp-end").value=item.endDate||"";
    g("dp-tag").value=item.tag||"";
    sDetColor=item.detColor||DET_COLORS[0];
    sDetSize=item.size||"normal";
    buildDetCP(); updateDetSzBtns();
    renderChildren(item);
    popSel("dp-proj",item.projId);
    document.getElementById("dp-notes").style.display="";
    document.getElementById("children-list").parentElement.style.display="";
  }
  g("dpanel").classList.add("open");
  renderBoard();
};
window.closeDetail=()=>{ detId=null; g("dpanel").classList.remove("open"); renderBoard(); };

function renderChildren(item){
  const list=g("children-list"); list.innerHTML="";
  const children=item.children||[];
  if(!children.length){ list.innerHTML='<div style="color:var(--panel-text3);font-size:.77rem;padding:2px 0">Sin post-its apoyados.</div>'; return; }
  children.forEach((c,idx)=>{
    const row=mk("div","child-row");
    const isNote=c.type==="note"||!c.type;
    let html='';
    if(!isNote){
      const chk=mk("div","child-chk"+(c.done?" done":""));
      chk.textContent=c.done?"✓":""; chk.onclick=e=>{e.stopPropagation();toggleChild(item.id,idx);};
      row.appendChild(chk);
    }
    const body=mk("div","child-body");
    body.innerHTML='<div class="child-type">'+(isNote?"📝 Nota rápida":"🔗 Sub-tema")+'</div>'+
      '<div class="child-title'+(c.done?" done":"")+'">'+esc(c.text||c.title||"")+'</div>'+
      (c.notes?'<div class="child-expand">Tiene notas →</div>':"");
    if(!isNote) body.onclick=()=>openChildDetail(item.id,idx);
    row.appendChild(body);
    const del=mk("button","child-del"); del.textContent="✕"; del.onclick=e=>{e.stopPropagation();deleteChild(item.id,idx);};
    row.appendChild(del);
    list.appendChild(row);
  });
}

let childDetailIdx=null, childDetailParentId=null;
window.openChildDetail=(parentId,idx)=>{
  const parent=items.find(i=>i.id===parentId); if(!parent)return;
  const child=(parent.children||[])[idx]; if(!child)return;
  childDetailParentId=parentId; childDetailIdx=idx;
  detType="child";
  g("dp-label").textContent="Sub-tema";
  g("dp-tit").value=child.text||child.title||"";
  g("dp-notes").value=child.notes||"";
  g("dp-start").value=""; g("dp-end").value=""; g("dp-tag").value="";
  g("dpanel").classList.add("open");
};

window.setChildType=type=>{
  sChildType=type;
  g("atype-note").classList.toggle("on",type==="note");
  g("atype-sub").classList.toggle("on",type==="sub");
};

window.addChild=async()=>{
  if(!detId||detType!=="item")return;
  const text=g("child-inp").value.trim(); if(!text)return;
  const item=items.find(i=>i.id===detId); if(!item)return;
  const children=[...(item.children||[]),{type:sChildType,text,done:false,notes:""}];
  try{
    await updateDoc(doc(db,"projects",item.projId,"items",detId),{children});
    item.children=children; g("child-inp").value=""; renderChildren(item); renderBoard(); toast("Post-it agregado ✓");
  } catch(e){ toast("Error: "+e.message); }
};
g("child-inp").addEventListener("keydown",e=>{ if(e.key==="Enter") addChild(); });

async function toggleChild(itemId,idx){
  const item=items.find(i=>i.id===itemId); if(!item)return;
  const children=[...(item.children||[])]; children[idx]={...children[idx],done:!children[idx].done};
  try{ await updateDoc(doc(db,"projects",item.projId,"items",itemId),{children}); item.children=children; renderChildren(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
}
window.toggleChild=toggleChild;

async function deleteChild(itemId,idx){
  const item=items.find(i=>i.id===itemId); if(!item)return;
  const children=[...(item.children||[])]; children.splice(idx,1);
  try{ await updateDoc(doc(db,"projects",item.projId,"items",itemId),{children}); item.children=children; renderChildren(item); renderBoard(); }
  catch(e){ toast("Error: "+e.message); }
}

window.saveDet=async()=>{
  if(!detId)return;
  if(detType==="child"&&childDetailParentId!==null){
    const parent=items.find(i=>i.id===childDetailParentId); if(!parent)return;
    const children=[...(parent.children||[])];
    children[childDetailIdx]={...children[childDetailIdx],text:g("dp-tit").value.trim(),notes:g("dp-notes").value.trim()};
    try{ await updateDoc(doc(db,"projects",parent.projId,"items",childDetailParentId),{children}); parent.children=children; toast("Guardado ✓"); openDetail(childDetailParentId,"item"); }
    catch(e){ toast("Error: "+e.message); }
    return;
  }
  if(detType==="item"){
    const item=items.find(i=>i.id===detId); if(!item)return;
    const newProjId=g("dp-proj").value;
    const data={title:g("dp-tit").value.trim()||item.title,notes:g("dp-notes").value.trim(),startDate:g("dp-start").value||null,endDate:g("dp-end").value||null,tag:g("dp-tag").value.trim(),detColor:sDetColor,size:sDetSize};
    try{
      if(newProjId!==item.projId){
        const r=await addDoc(collection(db,"projects",newProjId,"items"),{...item,...data,projId:newProjId,createdAt:serverTimestamp()});
        await deleteDoc(doc(db,"projects",item.projId,"items",detId));
        items=items.filter(i=>i.id!==detId);
        items.push({...item,...data,id:r.id,projId:newProjId}); detId=r.id;
      } else { await updateDoc(doc(db,"projects",item.projId,"items",detId),data); Object.assign(item,data); }
      renderBoard(); toast("Guardado ✓");
    } catch(e){ toast("Error: "+e.message); }
  }
};

window.delDet=async()=>{
  if(!detId)return; if(!confirm("¿Eliminar?"))return;
  if(detType==="item"){
    const item=items.find(i=>i.id===detId); if(!item)return;
    try{ await deleteDoc(doc(db,"projects",item.projId,"items",detId)); items=items.filter(i=>i.id!==detId); closeDetail(); toast("Eliminado"); }
    catch(e){ toast("Error: "+e.message); }
  }
};

window.openEditProj=id=>{ const p=projects.find(p=>p.id===id); if(!p)return; ePid=id; g("mp-t").textContent="Editar proyecto"; g("mp-name").value=p.name; g("mp-desc").value=p.desc||""; g("mp-del").style.display="inline-block"; sEmoji=p.emoji||EMOJIS[0]; buildEP(); openM("m-proj"); };
window.saveProj=async()=>{
  const name=g("mp-name").value.trim(); if(!name)return toast("Ingresá un nombre");
  try{
    if(ePid){ await updateDoc(doc(db,"projects",ePid),{name,desc:g("mp-desc").value.trim(),emoji:sEmoji}); const p=projects.find(p=>p.id===ePid); if(p){p.name=name;p.emoji=sEmoji;} }
    else { const r=await addDoc(collection(db,"projects"),{name,desc:g("mp-desc").value.trim(),emoji:sEmoji,createdAt:serverTimestamp()}); projects.push({id:r.id,name,emoji:sEmoji}); }
    closeM("m-proj"); buildVisDD(); renderBoard(); toast(ePid?"Actualizado ✓":"Proyecto creado ✓");
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteProj=async()=>{
  if(!ePid||!confirm("¿Eliminar el proyecto y todos sus temas?"))return;
  try{
    await Promise.all(items.filter(i=>i.projId===ePid).map(i=>deleteDoc(doc(db,"projects",ePid,"items",i.id))));
    await deleteDoc(doc(db,"projects",ePid));
    projects=projects.filter(p=>p.id!==ePid); items=items.filter(i=>i.projId!==ePid); hiddenProjs.delete(ePid);
    closeM("m-proj"); buildVisDD(); renderBoard(); toast("Proyecto eliminado");
  } catch(e){ toast("Error: "+e.message); }
};

// ── Items CRUD ──
function popSel(elId,selId){ const s=g(elId); s.innerHTML=""; projects.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=(p.emoji||"")+" "+p.name;if(p.id===selId)o.selected=true;s.appendChild(o);}); }
window.openNewItem=projId=>{ eIid=null; g("mi-t").textContent="Nuevo tema"; ["mi-tit","mi-tag"].forEach(id=>g(id).value=""); g("mi-desc").value=""; g("mi-start").value=""; g("mi-end").value=""; g("mi-del").style.display="none"; sItemColor="yellow"; sSize="normal"; popSel("mi-proj",projId); buildItemCP(); setSz("normal"); openM("m-item"); };
window.openEditItem=itemId=>{ const item=items.find(i=>i.id===itemId); if(!item)return; eIid=itemId; g("mi-t").textContent="Editar tema"; g("mi-tit").value=item.title; g("mi-desc").value=item.desc||""; g("mi-start").value=item.startDate||""; g("mi-end").value=item.endDate||""; g("mi-tag").value=item.tag||""; g("mi-del").style.display="inline-block"; sItemColor=item.color||"yellow"; sSize=item.size||"normal"; popSel("mi-proj",item.projId); buildItemCP(); setSz(sSize); openM("m-item"); };
window.setSz=sz=>{ sSize=sz; g("sz-normal").classList.toggle("sel",sz==="normal"); g("sz-tall").classList.toggle("sel",sz==="tall"); };
window.saveItem=async()=>{
  const title=g("mi-tit").value.trim(); if(!title)return toast("Ingresá un título");
  const projId=g("mi-proj").value; if(!projId)return toast("Seleccioná un proyecto");
  const data={title,desc:g("mi-desc").value.trim(),startDate:g("mi-start").value||null,endDate:g("mi-end").value||null,tag:g("mi-tag").value.trim(),color:sItemColor,size:sSize};
  try{
    if(eIid){
      const item=items.find(i=>i.id===eIid);
      if(projId!==item.projId){
        const r=await addDoc(collection(db,"projects",projId,"items"),{...item,...data,projId,createdAt:serverTimestamp()});
        await deleteDoc(doc(db,"projects",item.projId,"items",eIid));
        items=items.filter(i=>i.id!==eIid); items.push({id:r.id,...item,...data,projId});
      } else { await updateDoc(doc(db,"projects",projId,"items",eIid),data); Object.assign(item,data); }
      toast("Actualizado ✓");
    } else {
      const r=await addDoc(collection(db,"projects",projId,"items"),{...data,notes:"",children:[],projId,createdAt:serverTimestamp()});
      items.push({id:r.id,...data,notes:"",children:[],projId}); toast("Tema creado ✓");
    }
    closeM("m-item"); renderBoard();
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteItem=async()=>{
  if(!eIid||!confirm("¿Eliminar?"))return;
  const item=items.find(i=>i.id===eIid); if(!item)return;
  try{ await deleteDoc(doc(db,"projects",item.projId,"items",eIid)); items=items.filter(i=>i.id!==eIid); if(detId===eIid)closeDetail(); closeM("m-item"); renderBoard(); toast("Eliminado"); }
  catch(e){ toast("Error: "+e.message); }
};

// ── Stickies (post-it rápido standalone) ──
window.openNewSticky=projId=>{ eSid=null; g("ms-t").textContent="📌 Post-it rápido"; g("ms-text").value=""; g("ms-del").style.display="none"; sStickyColor="pink"; popSel("ms-proj",projId); buildStickyCP(); openM("m-sticky"); };
window.openEditSticky=sid=>{ const s=stickies.find(s=>s.id===sid); if(!s)return; eSid=sid; g("ms-t").textContent="Editar post-it"; g("ms-text").value=s.text||""; g("ms-del").style.display="inline-block"; sStickyColor=s.color||"pink"; popSel("ms-proj",s.projId); buildStickyCP(); openM("m-sticky"); };
window.saveSticky=async()=>{
  const text=g("ms-text").value.trim(); if(!text)return toast("Escribí algo");
  const projId=g("ms-proj").value;
  try{
    if(eSid){ await updateDoc(doc(db,"projects",projId,"stickies",eSid),{text,color:sStickyColor}); const s=stickies.find(s=>s.id===eSid); if(s){s.text=text;s.color=sStickyColor;} toast("Actualizado ✓"); }
    else { const r=await addDoc(collection(db,"projects",projId,"stickies"),{text,color:sStickyColor,projId,createdAt:serverTimestamp()}); stickies.push({id:r.id,text,color:sStickyColor,projId}); toast("Post-it creado ✓"); }
    closeM("m-sticky"); renderBoard();
  } catch(e){ toast("Error: "+e.message); }
};
window.deleteSticky=async()=>{
  if(!eSid||!confirm("¿Eliminar?"))return;
  const s=stickies.find(s=>s.id===eSid); if(!s)return;
  try{ await deleteDoc(doc(db,"projects",s.projId,"stickies",eSid)); stickies=stickies.filter(x=>x.id!==eSid); closeM("m-sticky"); renderBoard(); toast("Eliminado"); }
  catch(e){ toast("Error: "+e.message); }
};

// ── Pickers ──
function buildEP(){ const c=g("ep"); c.innerHTML=""; EMOJIS.forEach(e=>{const s=mk("span","eo"+(e===sEmoji?" sel":""));s.textContent=e;s.onclick=()=>{sEmoji=e;c.querySelectorAll(".eo").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");};c.appendChild(s);}); }
function buildItemCP(){ const c=g("item-cp"); c.innerHTML=""; PCOLS.forEach(col=>{const d=mk("div","pco"+(col.k===sItemColor?" sel":""));d.style.background=col.bg;d.title=col.k;d.onclick=()=>{sItemColor=col.k;c.querySelectorAll(".pco").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");};c.appendChild(d);}); }
function buildStickyCP(){ const c=g("sticky-cp"); c.innerHTML=""; PCOLS.forEach(col=>{const d=mk("div","pco"+(col.k===sStickyColor?" sel":""));d.style.background=col.bg;d.title=col.k;d.onclick=()=>{sStickyColor=col.k;c.querySelectorAll(".pco").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");};c.appendChild(d);}); }
function buildDetCP(){ const c=g("dp-cp"); c.innerHTML=""; DET_COLORS.forEach(col=>{const d=mk("div","co-sm"+(col===sDetColor?" sel":""));d.style.background=col;d.onclick=()=>{sDetColor=col;c.querySelectorAll(".co-sm").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");};c.appendChild(d);}); }

// ── Modals ──
window.openM=id=>g(id).classList.add("open");
window.closeM=id=>g(id).classList.remove("open");
document.querySelectorAll(".mo").forEach(o=>o.addEventListener("click",e=>{ if(e.target===o) o.classList.remove("open"); }));
function toast(msg){ const t=mk("div","toast"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
buildEP(); buildItemCP(); buildStickyCP(); buildDetCP();
</script>
</body>
</html>
